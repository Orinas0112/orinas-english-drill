// Glassmorphism card style — reads the live palette C. Apply with className="glass".
function glassSx(radius, extra) {
  return {
    background: C.cardGlass,
    borderRadius: radius || 14,
    border: "1px solid "+C.bdr,

    ...(extra || {}),
  };
}
// Animated count-up number. requestAnimationFrame is fine here (only particles must avoid it).
function CountUp({ value, dur, className, style }) {
  const [disp, setDisp] = useState(value);
  const fromRef = useRef(value);
  useEffect(() => {
    const from = fromRef.current, to = value, d = dur || 650;
    if (from === to) { setDisp(to); return; }
    let raf; const start = performance.now();
    const tick = (now) => {
      const p = Math.min(1, (now - start) / d);
      const e = 1 - Math.pow(1 - p, 3);
      setDisp(Math.round(from + (to - from) * e));
      if (p < 1) raf = requestAnimationFrame(tick); else fromRef.current = to;
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [value]);
  return <span className={className} style={style}>{disp}</span>;
}
// Ambient floating light particles (pure CSS animation, no JS loop).
const PARTICLES = [
  { l:"8%",  s:46, d:"0s",   dur:"15s" },

  { l:"88%", s:30, d:"10s",  dur:"20s" },
  { l:"50%", s:18, d:"13s",  dur:"23s" },
];
function Ambient() {
  return (
    <div style={{position:"fixed",inset:0,overflow:"hidden",pointerEvents:"none",zIndex:0}}>
      {PARTICLES.map((p,i)=>(
        <div key={i} className="particle" style={{left:p.l,bottom:"-60px",width:p.s,height:p.s,
          animationDelay:p.d,animationDuration:p.dur}} />
      ))}
    </div>
  );
}

// ═══════════════════ UTILS ═══════════════════
const shuffle = a => { const b=[...a]; for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];} return b; };
const norm = s => s.toLowerCase().replace(/[^a-z0-9 ]/g,"").replace(/\s+/g," ").trim();

function pickWrong(correct, pool, n) {
  n = n || 3;
  return shuffle(pool.filter(v => v.w !== correct.w)).slice(0, n);
}

function checkTyped(input, word) {
  const i = norm(input);
  const core = norm(word.replace(/\(.*?\)/g,"").trim());
  if (!i) return false;
  if (i === core) return true;
  const words = core.split(" ");
  if (words.length > 1 && words.every(w => i.includes(w))) return true;
  if (core.length > 3 && (i.includes(core) || core.includes(i))) return true;
  const a=i, b=core;
  const m = [];
  for (let x=0;x<=a.length;x++) { m[x]=[]; for(let y=0;y<=b.length;y++) m[x][y]=x||y; }
  for(let x=1;x<=a.length;x++) for(let y=1;y<=b.length;y++)
    m[x][y]=Math.min(m[x-1][y]+1,m[x][y-1]+1,m[x-1][y-1]+(a[x-1]!==b[y-1]?1:0));
  return m[a.length][b.length] <= Math.max(1, Math.floor(core.length * 0.25));
}

function selectWords(vocab, mastery, count, catFilter, diagnostic) {
  count = count || 10;
  catFilter = catFilter || "all";
  let pool = catFilter === "all" ? vocab.slice() : vocab.filter(v => v.c === catFilter);
  if (pool.length === 0) pool = vocab.slice();

  // Personalization based on diagnostic results
  if (diagnostic && catFilter === "all") {
    const level = cefrToNum(diagnostic.overall);
    if (level >= 4) {
      // Advanced users: reduce basic (c) category, increase advanced (a) and tough (t)
      const advanced = pool.filter(v => v.c === "a" || v.c === "t");
      const others = pool.filter(v => v.c !== "a" && v.c !== "t" && v.c !== "c");
      const basic = pool.filter(v => v.c === "c").slice(0, Math.floor(pool.filter(v => v.c === "c").length * 0.3));
      pool = [...advanced, ...others, ...basic];
    } else if (level <= 2) {
      // Beginners: prioritize basic (c, bg) categories
      const basic = pool.filter(v => v.c === "c" || v.c === "bg");
      const others = pool.filter(v => v.c !== "c" && v.c !== "bg").slice(0, Math.floor(pool.length * 0.3));
      pool = [...basic, ...others];
    }
  }

  const scored = pool.map(v => ({ ...v, score: mastery[v.w] || 0 }));
  scored.sort((a,b) => a.score - b.score || Math.random() - 0.5);
  return scored.slice(0, Math.min(count, scored.length));
}

function effectiveStreak(s) {
  if (!s || !s.lastDate) return 0;
  if (s.lastDate === todayKey() || s.lastDate === yesterdayKey()) return s.count;
  return 0;
}

// ── Confetti (Web Animations API, no dependency) ──
function confetti(n, big) {
  if (typeof document === "undefined" || !document.body) return;
  n = n || 24;
  const colors = [C.gold, C.ok, C.lav, C.dusty, C.lilac, "#6A9FD8"];
  const root = document.createElement("div");
  root.style.cssText = "position:fixed;inset:0;pointer-events:none;z-index:9999;overflow:hidden";
  document.body.appendChild(root);
  for (let i=0;i<n;i++) {
    const p = document.createElement("div");
    const size = 6 + Math.random()*6;
    const left = big ? Math.random()*100 : (40 + Math.random()*20);
    const startTop = big ? -8 : (38 + Math.random()*12);
    const color = colors[Math.floor(Math.random()*colors.length)];
    const xdrift = (Math.random()*2-1) * (big ? 180 : 90);
    const ydrift = (big ? 110 : 70);
    p.style.cssText = "position:absolute;top:"+startTop+"%;left:"+left+"%;width:"+size+"px;height:"+(size*0.6)+"px;background:"+color+";border-radius:2px";
    root.appendChild(p);
    try {
      p.animate([
        { transform:"translate(0,0) rotate(0deg)", opacity:1 },
        { transform:"translate("+xdrift+"px,"+ydrift+"vh) rotate("+(Math.random()*720-360)+"deg)", opacity:0 }
      ], { duration: 900 + Math.random()*900, delay: Math.random()*150, easing:"cubic-bezier(.2,.6,.4,1)", fill:"forwards" });
    } catch(e) {}
  }
  setTimeout(() => root.remove(), 2200);
}

function levelInfo(xp) {
  let li = 0;
  for (let i=0;i<LEVELS.length;i++) { if (xp >= LEVELS[i].xp) li = i; }
  const cur = LEVELS[li];
  const next = LEVELS[li+1] || null;
  const into = xp - cur.xp;
  const span = next ? next.xp - cur.xp : 1;
  const pct = next ? Math.min(100, into / span * 100) : 100;
  return { lvNum: li+1, name: cur.n, icon: cur.icon, next, into, span, pct, xp };
}

// ── Word of the day (one fixed word per day) ──
function getWordOfTheDay(vocab, mastery) {
  try {
    const r = localStorage.getItem('orinas-wotd-v1');
    if (r) {
      const s = JSON.parse(r);
      if (s && s.date === todayKey()) {
        const v = vocab.find(x => x.w === s.word);
        if (v) return v;
      }
    }
  } catch(e) {}
  // Prefer weak words (mastery 0-1); otherwise pick from the whole list.
  const weak = vocab.filter(v => (mastery[v.w] || 0) <= 1);
  const pool = weak.length ? weak : vocab;
  const v = pool[Math.floor(Math.random() * pool.length)];
  try { localStorage.setItem('orinas-wotd-v1', JSON.stringify({ date: todayKey(), word: v.w })); } catch(e) {}
  return v;
}

// ═══════════════════ TEXT-TO-SPEECH BUTTON ═══════════════════
function SpeakButton({ text, size }) {
  const [on, setOn] = useState(false);
  const sz = size || 16;
  const speak = (e) => {
    e.stopPropagation();
    const synth = window.speechSynthesis;
    if (!synth) return;
    if (on) { synth.cancel(); setOn(false); return; }
    synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US"; u.rate = 0.85;
    u.onend = () => setOn(false);
    u.onerror = () => setOn(false);
    setOn(true);
    synth.speak(u);
  };
  return (
    <button onClick={speak} title="読み上げ"
      className={on?"spk":""}
      style={{...baseBtn,background:"transparent",padding:"2px 4px",fontSize:sz,lineHeight:1,color:C.lav,display:"inline-block",verticalAlign:"middle"}}>
      {on?"🔇":"🔊"}
    </button>
  );
}

// ═══════════════════ QUIZ MODE ═══════════════════
function QuizMode({ vocab, mastery, onAnswer, onCombo, onPerfect, catFilter, diagnostic }) {
  const [questions, setQuestions] = useState([]);
  const [idx, setIdx] = useState(0);
  const [selected, setSelected] = useState(null);
  const [results, setResults] = useState([]);
  const [done, setDone] = useState(false);
  const [resume, setResume] = useState(null);
  const [combo, setCombo] = useState(0);
  const firstRef = useRef(true);

  const initNew = () => {
    const sel = selectWords(vocab, mastery, 10, catFilter, diagnostic);
    const qs = sel.map(v => {
      const d = Math.random() > 0.5 ? "jp" : "en";
      const wrong = pickWrong(v, vocab);
      return { word:v, dir:d, choices:shuffle([v,...wrong]) };
    });
    clearSession('quiz'); setResume(null); setCombo(0);
    setQuestions(qs); setIdx(0); setSelected(null); setResults([]); setDone(false);
  };
  useEffect(() => {
    if (firstRef.current) {
      firstRef.current = false;
      const saved = loadSession('quiz');
      if (saved) { setResume(saved); return; }
    }
    initNew();
  }, [catFilter]);

  const doResume = () => {
    const s = resume;
    setQuestions(s.questions); setResults(s.results); setIdx(s.results.length);
    setSelected(null); setDone(false); setResume(null); setCombo(0);
  };

  if (resume) return <ResumeDialog answered={resume.results.length} total={resume.questions.length} onResume={doResume} onNew={initNew} />;
  if (questions.length === 0) return null;
  if (done) {
    const correct = results.filter(r=>r).length;
    const perfect = correct===results.length && results.length>=10;
    return (
      <div className="fade-in" style={{padding:24,textAlign:"center"}}>
        <div style={{fontSize:64,marginBottom:16}}>{perfect?"💎":correct>=8?"🎉":correct>=5?"👍":"💪"}</div>
        {perfect&&(
          <div className="lv-bounce" style={{display:"inline-block",background:"linear-gradient(90deg,"+C.dusty+","+C.gold+")",
            color:"#1A0E1E",fontWeight:700,fontSize:16,padding:"6px 18px",borderRadius:999,marginBottom:12,letterSpacing:1}}>Perfect! 💎</div>
        )}
        <div style={{fontFamily:"'Noto Sans JP',sans-serif",fontSize:32,fontWeight:700,marginBottom:8}}><CountUp value={correct} dur={800} /> / {results.length}</div>
        <div style={{color:C.muted,marginBottom:32}}>{perfect?"全問正解！圧巻です":correct>=8?"Excellent!":correct>=5?"Good progress!":"Keep practicing!"}</div>
        <button onClick={initNew} className="main-btn" style={{...baseBtn,background:C.btnGrad,color:ON_ACCENT,padding:"14px 32px",fontSize:16}}>Next Round →</button>
      </div>
    );
  }

  const q = questions[idx];
  const isCorrect = selected !== null ? selected === q.word.w : null;

  return (
    <div key={idx} className="q-anim" style={{padding:"16px 20px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
        <span style={{color:C.muted,fontSize:14}}>{idx+1} / {questions.length}</span>
        <span style={{background:CAT_C[q.word.c],color:"white",padding:"3px 10px",borderRadius:20,fontSize:12}}>{CAT_L[q.word.c]}</span>
      </div>
      <div style={{textAlign:"center",marginBottom:28}}>
        <div style={{color:C.muted,fontSize:13,marginBottom:6}}>{q.dir==="jp"?"この意味の英語は？":"この英語の意味は？"}</div>
        <div style={{fontFamily:"'Noto Sans JP',sans-serif",fontSize:26,fontWeight:700,lineHeight:1.3}}>
          {q.dir==="jp"?q.word.m:q.word.w}
        </div>
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        {q.choices.map(ch => {
          const isThis = selected===ch.w;
          const isRight = ch.w===q.word.w;
          let bg=C.card, bdr=C.bdr;
          if(selected!==null){
            if(isRight){bg="rgba(110,203,115,0.15)";bdr=C.ok;}
            else if(isThis){bg="rgba(232,112,112,0.15)";bdr=C.ng;}
          }
          return (
            <button key={ch.w} disabled={selected!==null}
              className={"choice-btn "+(selected!==null&&isThis?(isCorrect?"pulse":"shake"):"")}
              onClick={()=>{
                setSelected(ch.w);
                const ok=ch.w===q.word.w;
                onAnswer(q.word.w,ok);
                const nr=[...results,ok];
                setResults(nr);
                saveSession('quiz',{questions,results:nr});
                if(ok){ const nc=combo+1; setCombo(nc); confetti(nc>=5?44:22, nc>=5); if(onCombo) onCombo(nc,'quiz'); }
                else setCombo(0);
              }}
              style={{...baseBtn,background:bg,border:"1.5px solid "+bdr,padding:"14px 16px",fontSize:15,color:C.cream,textAlign:"left",width:"100%"}}>
              {q.dir==="jp"?ch.w:ch.m}
            </button>
          );
        })}
      </div>
      {isCorrect&&combo>=3&&(
        <div className="pulse" style={{marginTop:16,textAlign:"center",fontSize:18,fontWeight:700,color:C.gold}}>
          {combo>=5?"On fire! 🔥🔥🔥":combo+" in a row! 🔥"}
        </div>
      )}
      {selected!==null&&(
        <div className="fade-in" style={{marginTop:20,padding:16,background:C.card,borderRadius:12,borderLeft:"3px solid "+(isCorrect?C.ok:C.ng)}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:4}}>
            <span style={{fontSize:13,color:C.muted}}>例文</span>
            <SpeakButton text={q.word.e} />
          </div>
          <div style={{fontSize:14,fontStyle:"italic",lineHeight:1.5}}>{q.word.e}</div>
        </div>
      )}
      {selected!==null&&(
        <div style={{textAlign:"center",marginTop:20}}>
          <button onClick={()=>{if(idx<questions.length-1){setIdx(idx+1);setSelected(null);}else{clearSession('quiz');if(onPerfect&&results.length>=10&&results.every(Boolean))onPerfect();setDone(true);}}}
            className="main-btn" style={{...baseBtn,background:C.btnGrad,color:ON_ACCENT,padding:"12px 28px",fontSize:15}}>
            {idx<questions.length-1?"Next →":"Results →"}
          </button>
        </div>
      )}
    </div>
  );
}

// ═══════════════════ TYPE MODE ═══════════════════
function TypeMode({ vocab, mastery, onAnswer, onCombo, onPerfect, catFilter, diagnostic }) {
  const [questions, setQuestions] = useState([]);
  const [idx, setIdx] = useState(0);
  const [input, setInput] = useState("");
  const [checked, setChecked] = useState(null);
  const [hintLv, setHintLv] = useState(0);
  const [results, setResults] = useState([]);
  const [done, setDone] = useState(false);
  const [resume, setResume] = useState(null);
  const [combo, setCombo] = useState(0);
  const inputRef = useRef(null);
  const firstRef = useRef(true);

  const initNew = () => {
    const sel = selectWords(vocab, mastery, 10, catFilter, diagnostic);
    clearSession('type'); setResume(null); setCombo(0);
    setQuestions(sel); setIdx(0); setInput(""); setChecked(null); setHintLv(0); setResults([]); setDone(false);
  };
  useEffect(() => {
    if (firstRef.current) {
      firstRef.current = false;
      const saved = loadSession('type');
      if (saved) { setResume(saved); return; }
    }
    initNew();
  }, [catFilter]);
  useEffect(() => { if(inputRef.current&&checked===null&&!resume) inputRef.current.focus(); }, [idx,checked,resume]);

  const doResume = () => {
    const s = resume;
    setQuestions(s.questions); setResults(s.results); setIdx(s.results.length);
    setInput(""); setChecked(null); setHintLv(0); setDone(false); setResume(null); setCombo(0);
  };

  if (resume) return <ResumeDialog answered={resume.results.length} total={resume.questions.length} onResume={doResume} onNew={initNew} />;
  if(questions.length===0) return null;
  if(done){
    const correct=results.filter(r=>r).length;
    const missed=questions.filter((_,i)=>!results[i]);
    const perfect = correct===results.length && results.length>=10;
    return (
      <div className="fade-in" style={{padding:24,textAlign:"center"}}>
        <div style={{fontSize:64,marginBottom:16}}>{perfect?"💎":correct>=8?"🎉":correct>=5?"👍":"💪"}</div>
        {perfect&&(
          <div className="lv-bounce" style={{display:"inline-block",background:"linear-gradient(90deg,"+C.dusty+","+C.gold+")",
            color:"#1A0E1E",fontWeight:700,fontSize:16,padding:"6px 18px",borderRadius:999,marginBottom:12,letterSpacing:1}}>Perfect! 💎</div>
        )}
        <div style={{fontFamily:"'Noto Sans JP',sans-serif",fontSize:32,fontWeight:700,marginBottom:8}}><CountUp value={correct} dur={800} />/{results.length}</div>
        {missed.length>0&&(
          <div style={{marginTop:20,textAlign:"left"}}>
            <div style={{color:C.muted,fontSize:13,marginBottom:10}}>復習が必要な単語：</div>
            {missed.map(v=>(
              <div key={v.w} style={{padding:"8px 12px",background:C.card,borderRadius:8,marginBottom:6,fontSize:14}}>
                <span style={{color:C.lav,fontWeight:600}}>{v.w}</span>
                <span style={{color:C.muted}}> — {v.m}</span>
              </div>
            ))}
          </div>
        )}
        <button onClick={initNew} className="main-btn" style={{...baseBtn,background:C.btnGrad,color:ON_ACCENT,padding:"14px 32px",fontSize:16,marginTop:24}}>Next Round →</button>
      </div>
    );
  }

  const q = questions[idx];
  const hint = q.w.slice(0, Math.min(hintLv+1, q.w.length));

  const doCheck = () => {
    const ok = checkTyped(input, q.w);
    setChecked(ok);
    onAnswer(q.w, ok);
    const nr=[...results, ok];
    setResults(nr);
    saveSession('type',{questions,results:nr});
    if(ok){ const nc=combo+1; setCombo(nc); confetti(nc>=5?44:22, nc>=5); if(onCombo) onCombo(nc,'type'); }
    else setCombo(0);
  };

  return (
    <div key={idx} className="q-anim" style={{padding:"16px 20px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
        <span style={{color:C.muted,fontSize:14}}>{idx+1}/{questions.length}</span>
        <span style={{background:CAT_C[q.c],color:"white",padding:"3px 10px",borderRadius:20,fontSize:12}}>{CAT_L[q.c]}</span>
      </div>
      <div style={{textAlign:"center",marginBottom:24}}>
        <div style={{color:C.muted,fontSize:13,marginBottom:6}}>この意味の英語をタイプしてください</div>
        <div style={{fontFamily:"'Noto Sans JP',sans-serif",fontSize:26,fontWeight:700,lineHeight:1.3}}>{q.m}</div>
      </div>
      {hintLv>0&&checked===null&&(
        <div className="fade-in" style={{textAlign:"center",marginBottom:12,color:C.gold,fontSize:14}}>
          ヒント: {hint}{"_".repeat(Math.max(0,q.w.length-hint.length))}
        </div>
      )}
      <div style={{display:"flex",gap:8,marginBottom:12}}>
        <input ref={inputRef} value={input} onChange={e=>setInput(e.target.value)} disabled={checked!==null}
          onKeyDown={e=>{if(e.key==="Enter"&&input.trim())doCheck();}}
          placeholder="Type the English word..."
          style={{flex:1,padding:"14px 16px",borderRadius:12,border:"1.5px solid "+(checked===null?C.bdr:checked?C.ok:C.ng),
            background:C.card,color:C.cream,fontSize:16,outline:"none"}} />
        {checked===null&&(
          <button onClick={doCheck} disabled={!input.trim()} className="main-btn"
            style={{...baseBtn,background:input.trim()?C.btnGrad:C.card,color:input.trim()?ON_ACCENT:C.muted,padding:"14px 18px",fontSize:15,opacity:input.trim()?1:0.5}}>✓</button>
        )}
      </div>
      {checked===null&&(
        <button onClick={()=>setHintLv(h=>h+1)}
          style={{...baseBtn,background:"transparent",color:C.muted,padding:"8px 0",fontSize:13,width:"100%"}}>
          💡 ヒントを見る
        </button>
      )}
      {checked&&combo>=3&&(
        <div className="pulse" style={{textAlign:"center",fontSize:18,fontWeight:700,color:C.gold,marginBottom:14}}>
          {combo>=5?"On fire! 🔥🔥🔥":combo+" in a row! 🔥"}
        </div>
      )}
      {checked!==null&&(
        <div className="fade-in" style={{padding:16,background:C.card,borderRadius:12,borderLeft:"3px solid "+(checked?C.ok:C.ng),marginBottom:16}}>
          <div style={{fontSize:14,marginBottom:4}}>
            {checked
              ? <span style={{color:C.ok}}>✓ Correct!</span>
              : <span style={{color:C.ng}}>✗ 正解: <strong style={{color:C.lav}}>{q.w}</strong></span>}
          </div>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginTop:8}}>
            <span style={{fontSize:13,color:C.muted}}>例文</span>
            <SpeakButton text={q.e} />
          </div>
          <div style={{fontSize:14,fontStyle:"italic",lineHeight:1.5}}>{q.e}</div>
        </div>
      )}
      {checked!==null&&(
        <div style={{textAlign:"center"}}>
          <button onClick={()=>{if(idx<questions.length-1){setIdx(idx+1);setInput("");setChecked(null);setHintLv(0);}else{clearSession('type');if(onPerfect&&results.length>=10&&results.every(Boolean))onPerfect();setDone(true);}}}
            className="main-btn" style={{...baseBtn,background:C.btnGrad,color:ON_ACCENT,padding:"12px 28px",fontSize:15}}>
            {idx<questions.length-1?"Next →":"Results →"}
          </button>
        </div>
      )}
    </div>
  );
}

        <span key={i} style={{color:i<=n?C.gold:C.bdr}}>★</span>

function ComposeMode({ onSolved }) {
  const [sc, setSc] = useState(null);
  const [text, setText] = useState("");
  const [loading, setLoading] = useState(false);
  const [result, setResult] = useState(null);
  const [error, setError] = useState(null);
  const [comp, setComp] = useState(loadCompose);
  const [openFolders, setOpenFolders] = useState({ fb:true });
  const [diffFilter, setDiffFilter] = useState("all");
  const [sortUncompleted, setSortUncompleted] = useState(true);

  const wordInfo = w => VOCAB.find(v=>v.w===w) || { w, m:"" };
  const reset = () => { setText(""); setResult(null); setError(null); };
  const best = id => (comp[id] && comp[id].best) || 0;
  const done = id => best(id) > 0;
  const folderOf = s => FOLDER_MAP[s.folder];
  const folderScenarios = fid => {
    let list = SCENARIOS.filter(s=>s.folder===fid && (diffFilter==="all" || s.diff===diffFilter));
    if(sortUncompleted) list = [...list].sort((a,b)=>(done(a.id)?1:0)-(done(b.id)?1:0));
    return list;
  };
  const folderTotal = fid => SCENARIOS.filter(s=>s.folder===fid).length;
  const folderDone = fid => SCENARIOS.filter(s=>s.folder===fid && done(s.id)).length;

  const submit = async () => {
    if(!text.trim()||loading) return;
    setLoading(true); setError(null); setResult(null);
    try {
      const res = await fetch("/api/evaluate", {
        method:"POST",
        headers:{"content-type":"application/json"},
        body: JSON.stringify({ scenario: sc.t+" — "+sc.s, words: sc.words, text }),
      });
      const data = await res.json().catch(()=>({}));
      if(!res.ok) throw new Error(data.error || ("サーバーエラー ("+res.status+")"));
      setResult(data);
      const r = data.rating || 0;
      if(r >= 1) {
        setComp(prev => {
          const next = { ...prev, [sc.id]: { best: Math.max((prev[sc.id]&&prev[sc.id].best)||0, r) } };
          saveCompose(next);
          return next;
        });
      }
      if(onSolved) onSolved();
      if(r>=4) confetti(60,true);
    } catch(e) {
      setError(e.message || "通信に失敗しました。");
    } finally {
      setLoading(false);
    }
  };

  // ── Scenario list (folder accordion) ──
  if(!sc) {
    const filters = [["all","すべて"],[1,"★"],[2,"★★"],[3,"★★★"]];
    return (
      <div className="fade-in" style={{padding:"16px 20px"}}>
        <div style={{fontFamily:"'Noto Sans JP',sans-serif",fontSize:22,fontWeight:700,marginBottom:6}}>Compose</div>
        <div style={{color:C.muted,fontSize:13,marginBottom:14,lineHeight:1.6}}>シナリオを1つ選び、指定の単語をすべて使って英作文しましょう。AIが添削します。</div>
        <div style={{display:"flex",gap:6,marginBottom:10,flexWrap:"wrap"}}>
          {filters.map(([val,lbl])=>(
            <button key={val} onClick={()=>setDiffFilter(val)}
              style={{...baseBtn,padding:"6px 14px",fontSize:13,borderRadius:20,
                background:diffFilter===val?C.btnGrad:C.card,color:diffFilter===val?ON_ACCENT:C.muted,
                border:"1px solid "+(diffFilter===val?"transparent":C.bdr)}}>{lbl}</button>
          ))}
        </div>
        <button onClick={()=>setSortUncompleted(v=>!v)}
          style={{...baseBtn,padding:"6px 12px",fontSize:12,borderRadius:8,background:"transparent",
            color:sortUncompleted?C.lav:C.muted,border:"1px solid "+C.bdr,marginBottom:16}}>
          {sortUncompleted?"☑":"☐"} 未完了を上に
        </button>
        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          {FOLDERS.map(f=>{
            const total = folderTotal(f.id), dn = folderDone(f.id);
            const list = folderScenarios(f.id);
            const open = !!openFolders[f.id];
            return (
              <div key={f.id} style={{...glassSx(14),overflow:"hidden"}}>
                <button onClick={()=>setOpenFolders(o=>({...o,[f.id]:!o[f.id]}))}
                  style={{...baseBtn,background:"transparent",padding:"13px 15px",width:"100%",textAlign:"left",display:"flex",alignItems:"center",gap:10}}>
                  <span style={{fontSize:20}}>{f.icon}</span>
                  <span style={{flex:1,color:C.cream,fontWeight:600,fontSize:15}}>{f.name}</span>
                  <span style={{color:f.color,fontSize:12,fontWeight:600}}>{dn}/{total} 完了</span>
                  <span style={{color:C.muted,fontSize:12,transform:open?"rotate(90deg)":"none",transition:"transform 0.2s"}}>▶</span>
                </button>
                {open && (
                  <div style={{display:"flex",flexDirection:"column",borderTop:"1px solid "+C.bdr}}>
                    {list.length===0 && <div style={{padding:"12px 16px",color:C.muted,fontSize:12}}>該当するシナリオはありません</div>}
                    {list.map(s=>(
                      <button key={s.id} onClick={()=>{setSc(s);reset();}}
                        style={{...baseBtn,background:"transparent",padding:"11px 15px",textAlign:"left",width:"100%",
                          display:"flex",alignItems:"center",gap:10,borderTop:"1px solid "+C.bdr}}>
                        <span style={{background:DIFFS[s.diff].color,color:"white",padding:"1px 7px",borderRadius:12,fontSize:10,fontWeight:600,whiteSpace:"nowrap"}}>{DIFFS[s.diff].label}</span>
                        <span style={{flex:1,color:C.cream,fontSize:14}}>{s.t}</span>
                        {done(s.id) && <span style={{color:C.gold,fontSize:12,letterSpacing:-1}}>{"★".repeat(best(s.id))}</span>}
                        {done(s.id) && <span style={{color:C.ok,fontSize:14}}>✅</span>}
                      </button>
                    ))}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      </div>
    );
  }

  // ── Compose / result ──
  const fld = folderOf(sc);
  const canSend = text.trim() && !loading;
  const nextInFolder = SCENARIOS.filter(x=>x.folder===sc.folder).find(x=>x.id!==sc.id && !done(x.id));
  return (
    <div className="fade-in" style={{padding:"16px 20px"}}>
      <button onClick={()=>{setSc(null);reset();}}
        style={{...baseBtn,background:"transparent",color:C.muted,padding:"4px 0",fontSize:13,marginBottom:12}}>← シナリオ一覧</button>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8,gap:8}}>

      {result&&(
        <div className="fade-in" style={{marginTop:20,display:"flex",flexDirection:"column",gap:14}}>

          {Array.isArray(result.vocabCheck)&&result.vocabCheck.length>0&&(
            <div style={{padding:16,background:C.card,borderRadius:12}}>
              <div style={{fontSize:13,color:C.muted,marginBottom:10}}>語彙チェック</div>

                  <span style={{color:ok?C.ok:C.ng,marginRight:6}}>{ok?"✓":"✗"}</span>
                  <span style={{color:C.lav,fontWeight:600}}>{vc.word}</span>
                  {vc.note&&<span style={{color:C.muted}}> — {vc.note}</span>}
                </div>
              );})}
            </div>
          )}
          {[{label:"文法",val:result.grammar},{label:"自然さ",val:result.naturalness}].map(sec=>sec.val&&(
            <div key={sec.label} style={{padding:16,background:C.card,borderRadius:12}}>
              <div style={{fontSize:13,color:C.muted,marginBottom:6}}>{sec.label}</div>
              <div style={{fontSize:14,lineHeight:1.6}}>{sec.val}</div>
            </div>
          ))}
          {result.improved&&(
            <div style={{padding:16,background:C.card,borderRadius:12,borderLeft:"3px solid "+C.lav}}>
              <div style={{fontSize:13,color:C.muted,marginBottom:6}}>改善例</div>
              <div style={{fontSize:15,fontStyle:"italic",lineHeight:1.6,color:C.lilac}}>{result.improved}</div>
            </div>
          )}
          <div style={{display:"flex",gap:10,marginTop:4}}>
            <button onClick={reset}
              style={{...baseBtn,flex:1,background:C.card,color:C.lav,border:"1px solid "+C.bdr,padding:"13px 0",fontSize:14,fontWeight:600}}>
              もう一度書く ↻
            </button>
            {nextInFolder ? (
              <button onClick={()=>{setSc(nextInFolder);reset();}} className="main-btn"
                style={{...baseBtn,flex:1,background:C.btnGrad,color:ON_ACCENT,padding:"13px 0",fontSize:14,fontWeight:600}}>
                次のシナリオ →
              </button>
            ) : (
              <button onClick={()=>{setSc(null);reset();}} className="main-btn"
                style={{...baseBtn,flex:1,background:C.btnGrad,color:ON_ACCENT,padding:"13px 0",fontSize:14,fontWeight:600}}>
                別のフォルダを選ぶ
              </button>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

// ═══════════════════ DIAGNOSTIC TEST ═══════════════════
function DiagnosticTest({ onComplete, onSkip }) {
  const [step, setStep] = useState(0); // 0=intro, 1-13=questions, 14=evaluating, 15=done
  const [answers, setAnswers] = useState([]);
  const [curLv, setCurLv] = useState(3); // CAT adaptive level (1-6)
  const [selected, setSelected] = useState(null);
  const [writeText, setWriteText] = useState("");
  const [writeLoading, setWriteLoading] = useState(false);
  const [writeResult, setWriteResult] = useState(null);
  const [partScores, setPartScores] = useState({ vocab:[], biz:[], grammar:[], write:null });

  // Generate adaptive questions based on current level
  const getQuestion = (qNum) => {
    if (qNum <= 5) {
      // Part 1: Vocabulary
      const pool = DIAG_VOCAB.filter(q => Math.abs(q.lv - curLv) <= 1);
      const unused = pool.filter(q => !answers.find(a => a.q === q.q));
      return { part:1, ...(unused[0] || pool[0]) };
    } else if (qNum <= 9) {
      // Part 2: Business expressions
      const pool = DIAG_BIZ.filter(q => Math.abs(q.lv - curLv) <= 1);
      const unused = pool.filter(q => !answers.find(a => a.q === q.q));
      return { part:2, ...(unused[0] || pool[0]) };
    } else if (qNum <= 12) {
      // Part 3: Grammar
      const pool = DIAG_GRAMMAR.filter(q => Math.abs(q.lv - curLv) <= 1);
      const unused = pool.filter(q => !answers.find(a => a.q === q.q));
      return { part:3, ...(unused[0] || pool[0]) };
    } else {
      // Part 4: Production (writing)
      return { part:4, ...DIAG_WRITE[0] };
    }
  };

  const currentQ = step >= 1 && step <= 13 ? getQuestion(step) : null;
  const choices = currentQ && currentQ.a ? shuffle([currentQ.a, ...currentQ.wrong]) : [];

  const handleSelect = (choice) => {
    if (selected !== null) return;
    setSelected(choice);
    const correct = choice === currentQ.a;
    const newAnswers = [...answers, { q: currentQ.q, lv: currentQ.lv, correct, part: currentQ.part }];
    setAnswers(newAnswers);
    // Update part scores
    const ps = { ...partScores };
    if (currentQ.part === 1) ps.vocab = [...ps.vocab, { lv: currentQ.lv, correct }];
    else if (currentQ.part === 2) ps.biz = [...ps.biz, { lv: currentQ.lv, correct }];
    else if (currentQ.part === 3) ps.grammar = [...ps.grammar, { lv: currentQ.lv, correct }];
    setPartScores(ps);
    // CAT: adjust difficulty
    if (correct && curLv < 6) setCurLv(Math.min(6, curLv + 1));
    else if (!correct && curLv > 1) setCurLv(Math.max(1, curLv - 1));
  };

  const handleNext = () => {
    setSelected(null);
    setStep(step + 1);
  };

  const handleWriteSubmit = async () => {
    if (!writeText.trim() || writeLoading) return;
    setWriteLoading(true);
    try {
      const res = await fetch("/api/evaluate", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({
          scenario: "Diagnostic: " + DIAG_WRITE[0].q,
          words: [],
          text: writeText,
        }),
      });
      const data = await res.json().catch(() => ({}));
      const rating = data.rating || 2;
      setWriteResult(data);
      setPartScores(ps => ({ ...ps, write: { rating, text: writeText } }));
    } catch (e) {
      setPartScores(ps => ({ ...ps, write: { rating: 2, text: writeText } }));
    } finally {
      setWriteLoading(false);
    }
  };

  const calculateResults = () => {
    // Calculate CEFR for each skill (average level of correct answers, weighted)
    const calcSkill = (arr) => {
      if (!arr || arr.length === 0) return 3;
      const correct = arr.filter(a => a.correct);
      if (correct.length === 0) return Math.max(1, arr[0].lv - 1);
      return correct.reduce((sum, a) => sum + a.lv, 0) / correct.length;
    };
    const vocabScore = calcSkill(partScores.vocab);
    const bizScore = calcSkill(partScores.biz);
    const grammarScore = calcSkill(partScores.grammar);
    const writeScore = partScores.write ? Math.min(6, (partScores.write.rating / 5) * 6) : 3;
    const overall = (vocabScore + bizScore + grammarScore + writeScore) / 4;
    return {
      overall: numToCefr(overall),
      overallNum: overall,
      vocab: numToCefr(vocabScore),
      vocabNum: vocabScore,
      biz: numToCefr(bizScore),
      bizNum: bizScore,
      grammar: numToCefr(grammarScore),
      grammarNum: grammarScore,
      write: numToCefr(writeScore),
      writeNum: writeScore,
      date: todayKey(),
    };
  };

  const finishTest = () => {
    const results = calculateResults();
    saveDiagnostic(results);
    onComplete(results);
  };

  // Intro screen
  if (step === 0) {
    return (
      <div className="fade-in" style={{padding:"24px 20px",textAlign:"center"}}>
        <div style={{fontSize:56,marginBottom:16}}>📋</div>
        <div style={{fontFamily:"'Noto Sans JP',sans-serif",fontSize:24,fontWeight:700,marginBottom:12}}>英語力診断テスト</div>
        <div style={{color:C.muted,fontSize:14,lineHeight:1.7,marginBottom:24}}>
          13問の適応型テストであなたの英語力を診断します。<br/>
          正解すると難易度が上がり、不正解だと下がります。<br/>
          所要時間: 約5〜10分
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:20}}>
          {[
            {icon:"📚",label:"Part 1: 語彙力",n:"5問"},
            {icon:"💬",label:"Part 2: ビジネス表現",n:"4問"},
            {icon:"✏️",label:"Part 3: 文法",n:"3問"},
            {icon:"📝",label:"Part 4: 産出力",n:"1問"},
          ].map((p,i)=>(
            <div key={i} style={{display:"flex",alignItems:"center",gap:12,padding:"12px 16px",background:C.card,borderRadius:10,textAlign:"left"}}>
              <span style={{fontSize:24}}>{p.icon}</span>
              <span style={{flex:1,color:C.cream}}>{p.label}</span>
              <span style={{color:C.muted,fontSize:13}}>{p.n}</span>
            </div>
          ))}
        </div>
        <button onClick={()=>setStep(1)} className="main-btn"
          style={{...baseBtn,background:C.btnGrad,color:ON_ACCENT,padding:"16px 0",fontSize:16,width:"100%",marginBottom:12}}>
          診断を開始する
        </button>
        {onSkip && (
          <button onClick={onSkip} style={{...baseBtn,background:"transparent",color:C.muted,padding:"12px 0",fontSize:14,width:"100%"}}>
            スキップして学習を始める
          </button>
        )}
      </div>
    );
  }

  // Writing question (Part 4)
  if (step === 13 && currentQ && currentQ.part === 4) {
    return (
      <div className="fade-in" style={{padding:"16px 20px"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
          <span style={{color:C.muted,fontSize:14}}>13 / 13</span>
          <span style={{background:C.dusty,color:"white",padding:"3px 12px",borderRadius:20,fontSize:12}}>Part 4: 産出力</span>
        </div>
        <div style={{height:6,background:C.card,borderRadius:3,overflow:"hidden",marginBottom:24}}>
          <div style={{height:"100%",width:"100%",background:C.btnGrad,transition:"width 0.3s"}} />
        </div>
        <div style={{color:C.lilac,fontSize:15,lineHeight:1.7,marginBottom:20,padding:"16px",background:C.card,borderRadius:12}}>
          {currentQ.q}
        </div>
        <textarea value={writeText} onChange={e=>setWriteText(e.target.value)} disabled={writeLoading || writeResult}
          placeholder="Write your response here..."
          rows={5}
          style={{width:"100%",padding:"14px 16px",borderRadius:12,border:"1.5px solid "+C.bdr,
            background:C.card,color:C.cream,fontSize:15,outline:"none",resize:"vertical",lineHeight:1.6,marginBottom:16}} />
        {!writeResult && (
          <button onClick={handleWriteSubmit} disabled={!writeText.trim() || writeLoading} className="main-btn"
            style={{...baseBtn,background:writeText.trim()&&!writeLoading?C.btnGrad:C.card,
              color:writeText.trim()&&!writeLoading?ON_ACCENT:C.muted,padding:"14px 0",fontSize:15,width:"100%"}}>
            {writeLoading ? "評価中..." : "回答を送信"}
          </button>
        )}
        {writeResult && (
          <div className="fade-in" style={{marginTop:16}}>
            <div style={{textAlign:"center",padding:16,background:C.card,borderRadius:12,marginBottom:16}}>
              <div style={{fontSize:13,color:C.muted,marginBottom:8}}>スコア</div>
              <div style={{fontSize:36,fontWeight:700,color:C.gold}}>{writeResult.rating || 2} / 5</div>
            </div>
            {writeResult.improved && (
              <div style={{padding:14,background:C.card,borderRadius:10,borderLeft:"3px solid "+C.lav,marginBottom:16}}>
                <div style={{fontSize:12,color:C.muted,marginBottom:6}}>改善例</div>
                <div style={{fontSize:14,fontStyle:"italic",color:C.lilac,lineHeight:1.6}}>{writeResult.improved}</div>
              </div>
            )}
            <button onClick={finishTest} className="main-btn"
              style={{...baseBtn,background:C.btnGrad,color:ON_ACCENT,padding:"14px 0",fontSize:15,width:"100%"}}>
              結果を見る →
            </button>
          </div>
        )}
      </div>
    );
  }

  // Multiple choice questions (Parts 1-3)
  if (currentQ && currentQ.a) {
    const partLabels = {1:"Part 1: 語彙力",2:"Part 2: ビジネス表現",3:"Part 3: 文法"};
    const progress = (step / 13) * 100;
    return (
      <div key={step} className="q-anim" style={{padding:"16px 20px"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
          <span style={{color:C.muted,fontSize:14}}>{step} / 13</span>
          <span style={{background:C.dusty,color:"white",padding:"3px 12px",borderRadius:20,fontSize:12}}>{partLabels[currentQ.part]}</span>
        </div>
        <div style={{height:6,background:C.card,borderRadius:3,overflow:"hidden",marginBottom:24}}>
          <div style={{height:"100%",width:progress+"%",background:C.btnGrad,transition:"width 0.3s"}} />
        </div>
        <div style={{textAlign:"center",marginBottom:28}}>
          <div style={{color:C.muted,fontSize:12,marginBottom:8}}>難易度: {["","A1","A2","B1","B2","C1","C2"][currentQ.lv]}</div>
          <div style={{fontFamily:"'Noto Sans JP',sans-serif",fontSize:18,fontWeight:600,lineHeight:1.5,color:C.cream}}>
            {currentQ.q}
          </div>
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          {choices.map((ch,i) => {
            const isThis = selected === ch;
            const isRight = ch === currentQ.a;
            let bg = C.card, bdr = C.bdr;
            if (selected !== null) {
              if (isRight) { bg = "rgba(110,203,115,0.15)"; bdr = C.ok; }
              else if (isThis) { bg = "rgba(232,112,112,0.15)"; bdr = C.ng; }
            }
            return (
              <button key={i} disabled={selected !== null}
                className={"choice-btn " + (selected !== null && isThis ? (isRight ? "pulse" : "shake") : "")}
                onClick={() => handleSelect(ch)}
                style={{...baseBtn,background:bg,border:"1.5px solid "+bdr,padding:"14px 16px",fontSize:15,color:C.cream,textAlign:"left",width:"100%"}}>
                {ch}
              </button>
            );
          })}
        </div>
        {selected !== null && (
          <div style={{textAlign:"center",marginTop:24}}>
            <button onClick={handleNext} className="main-btn"
              style={{...baseBtn,background:C.btnGrad,color:ON_ACCENT,padding:"12px 28px",fontSize:15}}>
              {step < 13 ? "Next →" : "Part 4 へ →"}
            </button>
          </div>
        )}
      </div>
    );
  }

  return null;
}

// ═══════════════════ DIAGNOSTIC RESULT SCREEN ═══════════════════
function DiagnosticResult({ result, prevResult, onClose, onRetake }) {
  const chartRef = useRef(null);
  const chartInstance = useRef(null);

  useEffect(() => {
    if (!chartRef.current || typeof Chart === "undefined") return;
    if (chartInstance.current) chartInstance.current.destroy();
    const ctx = chartRef.current.getContext("2d");
    const data = {
      labels: ["語彙力", "ビジネス表現", "文法", "産出力"],
      datasets: [{
        label: "現在",
        data: [result.vocabNum, result.bizNum, result.grammarNum, result.writeNum],
        backgroundColor: "rgba(142,86,135,0.3)",
        borderColor: C.dusty,
        borderWidth: 2,
        pointBackgroundColor: C.dusty,
      }],
    };
    if (prevResult) {
      data.datasets.push({
        label: "前回",
        data: [prevResult.vocabNum, prevResult.bizNum, prevResult.grammarNum, prevResult.writeNum],
        backgroundColor: "rgba(106,159,216,0.2)",
        borderColor: "#6A9FD8",
        borderWidth: 1,
        borderDash: [5, 5],
        pointBackgroundColor: "#6A9FD8",
      });
    }
    chartInstance.current = new Chart(ctx, {
      type: "radar",
      data,
      options: {
        scales: {
          r: {
            min: 0, max: 6,
            ticks: { stepSize: 1, display: false },
            pointLabels: { color: C.muted, font: { size: 12 } },
            grid: { color: C.bdr },
            angleLines: { color: C.bdr },
          }
        },
        plugins: { legend: { display: !!prevResult, labels: { color: C.muted } } },
        elements: { line: { tension: 0.1 } },
      }
    });
    return () => { if (chartInstance.current) chartInstance.current.destroy(); };
  }, [result, prevResult]);

  const improved = prevResult && cefrToNum(result.overall) > cefrToNum(prevResult.overall);
  const skills = [
    { key:"vocab", label:"語彙力", icon:"📚" },
    { key:"biz", label:"ビジネス表現", icon:"💬" },
    { key:"grammar", label:"文法", icon:"✏️" },
    { key:"write", label:"産出力", icon:"📝" },
  ];
  const strongest = skills.reduce((a,b) => result[a.key+"Num"] >= result[b.key+"Num"] ? a : b);
  const weakest = skills.reduce((a,b) => result[a.key+"Num"] <= result[b.key+"Num"] ? a : b);

  // Personalized recommendations
  const getRecommendations = () => {
    const recs = [];
    if (result.writeNum < result.vocabNum - 1) {
      recs.push({ icon:"✏️", text:"語彙は豊富ですが産出力が弱め。Composeモードで「使える英語」を増やしましょう。", mode:"compose" });
    }
    if (result.vocabNum <= 3) {
      recs.push({ icon:"🎯", text:"語彙力を強化しましょう。Quiz/Typeモードで単語を増やすのがおすすめです。", mode:"quiz" });
    }
    if (result.grammarNum <= 3) {
      recs.push({ icon:"📚", text:"文法の正確性を高めましょう。Typeモードでスペルと文法を同時に練習できます。", mode:"type" });
    }
    if (result.bizNum <= 3) {
      recs.push({ icon:"💼", text:"ビジネス表現を学びましょう。Advanced/Toughカテゴリに挑戦してみてください。", mode:"quiz" });
    }
    if (recs.length === 0) {
      recs.push({ icon:"🌟", text:"バランスの取れた英語力です！Composeモードでさらに実践力を磨きましょう。", mode:"compose" });
    }
    return recs.slice(0, 2);
  };

  return (
    <div className="fade-in" style={{padding:"20px",maxWidth:440,margin:"0 auto"}}>
      <div style={{textAlign:"center",marginBottom:24}}>
        <div style={{fontSize:48,marginBottom:8}}>{improved?"🎉":"📊"}</div>
        <div style={{fontFamily:"'Noto Sans JP',sans-serif",fontSize:22,fontWeight:700,marginBottom:8}}>診断結果</div>
        {prevResult && improved && (
          <div className="pulse" style={{display:"inline-block",background:"linear-gradient(90deg,"+C.ok+","+C.gold+")",
            color:"#1A0E1E",fontWeight:700,fontSize:14,padding:"4px 14px",borderRadius:999,marginBottom:8}}>
            レベルアップ！ 🎊
          </div>
        )}
      </div>

      {/* Overall CEFR */}
      <div className="glass" style={{...glassSx(16),padding:"24px 20px",textAlign:"center",marginBottom:20}}>
        <div style={{fontSize:13,color:C.muted,marginBottom:8}}>総合レベル</div>
        <div className="txt-glow" style={{fontFamily:"'Noto Sans JP',sans-serif",fontSize:56,fontWeight:700,color:C.lav}}>
          {result.overall}
        </div>
        <div style={{fontSize:14,color:C.cream,marginTop:4}}>TOEIC目安: {CEFR_TOEIC[result.overall]}</div>
        {prevResult && (
          <div style={{fontSize:13,color:improved?C.ok:C.muted,marginTop:8}}>
            前回: {prevResult.overall} {improved && "→ "+result.overall+" ⬆"}
          </div>
        )}
      </div>

      {/* Radar chart */}
      <div className="glass" style={{...glassSx(14),padding:"16px",marginBottom:20}}>
        <div style={{fontSize:13,color:C.muted,marginBottom:12,textAlign:"center"}}>スキル別レーダーチャート</div>
        <canvas ref={chartRef} style={{maxHeight:220}} />
      </div>

      {/* Skill breakdown */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:20}}>
        {skills.map(s => (
          <div key={s.key} className="glass" style={{...glassSx(10),padding:"12px",textAlign:"center"}}>
            <span style={{fontSize:20}}>{s.icon}</span>
            <div style={{fontSize:11,color:C.muted,marginTop:4}}>{s.label}</div>
            <div style={{fontSize:20,fontWeight:700,color:s.key===strongest.key?C.ok:s.key===weakest.key?C.gold:C.lav}}>
              {result[s.key]}
            </div>
          </div>
        ))}
      </div>

      {/* Analysis */}
      <div className="glass" style={{...glassSx(12),padding:"16px",marginBottom:20}}>
        <div style={{fontSize:13,color:C.muted,marginBottom:10}}>分析</div>
        <div style={{fontSize:14,lineHeight:1.7,color:C.cream}}>
          <span style={{color:C.ok}}>得意分野: {strongest.icon} {strongest.label}</span><br/>
          <span style={{color:C.gold}}>伸ばすべき分野: {weakest.icon} {weakest.label}</span>
          {result.writeNum < result.vocabNum - 1 && (
            <div style={{marginTop:8,color:C.lilac}}>
              💡 語彙は知っているが使えていない状態です。アウトプット練習を増やしましょう。
            </div>
          )}
        </div>
      </div>

      {/* Recommendations */}
      <div className="glass" style={{...glassSx(12),padding:"16px",marginBottom:24}}>
        <div style={{fontSize:13,color:C.muted,marginBottom:10}}>おすすめ学習プラン</div>
        {getRecommendations().map((rec, i) => (
          <div key={i} style={{display:"flex",gap:10,alignItems:"flex-start",marginBottom:i<1?10:0}}>
            <span style={{fontSize:18}}>{rec.icon}</span>
            <span style={{fontSize:13,lineHeight:1.6,color:C.cream}}>{rec.text}</span>
          </div>
        ))}
      </div>

      <button onClick={onClose} className="main-btn"
        style={{...baseBtn,background:C.btnGrad,color:ON_ACCENT,padding:"16px 0",fontSize:16,width:"100%",marginBottom:12}}>
        学習を始める →
      </button>
      <button onClick={onRetake}
        style={{...baseBtn,background:"transparent",border:"1px solid "+C.bdr,color:C.muted,padding:"12px 0",fontSize:14,width:"100%"}}>
        もう一度診断する
      </button>
    </div>
  );
}

// ═══════════════════ RADAR CHART FOR STATS (mini version) ═══════════════════
function MiniRadarChart({ result }) {
  const chartRef = useRef(null);
  const chartInstance = useRef(null);

  useEffect(() => {
    if (!chartRef.current || typeof Chart === "undefined" || !result) return;
    if (chartInstance.current) chartInstance.current.destroy();
    const ctx = chartRef.current.getContext("2d");
    chartInstance.current = new Chart(ctx, {
      type: "radar",
      data: {
        labels: ["語彙", "表現", "文法", "産出"],
        datasets: [{
          data: [result.vocabNum, result.bizNum, result.grammarNum, result.writeNum],
          backgroundColor: "rgba(142,86,135,0.3)",
          borderColor: C.dusty,
          borderWidth: 2,
          pointBackgroundColor: C.dusty,
          pointRadius: 3,
        }],
      },
      options: {
        scales: {
          r: {
            min: 0, max: 6,
            ticks: { display: false },
            pointLabels: { color: C.muted, font: { size: 10 } },
            grid: { color: C.bdr },
            angleLines: { color: C.bdr },
          }
        },
        plugins: { legend: { display: false } },
      }
    });
    return () => { if (chartInstance.current) chartInstance.current.destroy(); };
  }, [result]);

  if (!result) return null;
  return <canvas ref={chartRef} style={{maxHeight:140}} />;
}

// ═══════════════════ LEVEL-UP OVERLAY ═══════════════════
function LevelUpOverlay({ info, onClose }) {
  const [stage, setStage] = useState(0);
  useEffect(() => {
    const t = setTimeout(() => { setStage(1); confetti(60, true); }, 650);
    return () => clearTimeout(t);
  }, []);
  return (
    <div onClick={onClose} style={{position:"fixed",inset:0,zIndex:9997,
      background:"rgba(17,10,20,0.9)",display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer"}}>
      <div style={{textAlign:"center",padding:24}}>
        <div className="pulse" style={{fontSize:24,color:C.gold,fontWeight:700,letterSpacing:4,marginBottom:28}}>🎉 LEVEL UP!</div>
        {stage>=1 && (
          <div className="fade-in">
            <div className="lv-bounce" style={{fontSize:104,lineHeight:1,marginBottom:14}}>{info.icon}</div>
            <div style={{fontFamily:"'Noto Sans JP',sans-serif",fontSize:40,fontWeight:700,color:ON_ACCENT}}>{info.name}</div>
            <div style={{fontSize:14,color:C.muted,marginTop:8}}>Lv{info.lvNum} に昇格しました</div>
          </div>
        )}
        <div style={{fontSize:12,color:C.muted,marginTop:40,opacity:stage>=1?1:0,transition:"opacity .5s"}}>タップして閉じる</div>
      </div>
    </div>
  );
}

// ═══════════════════ MAIN APP ═══════════════════
function App() {
  const [theme, setTheme] = useState(loadTheme);
  applyTheme(theme); // reassign module-scoped palette before rendering children
  const [mode, setMode] = useState("quiz");
  const [mastery, setMastery] = useState(loadMastery);
  const [daily, setDaily] = useState(loadDaily);
  const [streak, setStreak] = useState(loadStreak);
  const [xp, setXp] = useState(loadXP);
  const [calendar, setCalendar] = useState(loadCalendar);
  const [celebrate, setCelebrate] = useState(null);
  const [levelUp, setLevelUp] = useState(null);
  const [showWotd, setShowWotd] = useState(true);
  const [wotd] = useState(() => getWordOfTheDay(VOCAB, loadMastery()));
  const [catFilter, setCatFilter] = useState("all");
  const [headerFx, setHeaderFx] = useState({ type:"", key:0 });
  const [ach, setAch] = useState(loadAch);
  const [achQueue, setAchQueue] = useState([]);
  const achRef = useRef(ach);
  const achcRef = useRef(loadAchc());
  // Diagnostic state
  const [diagnostic, setDiagnostic] = useState(loadDiagnostic);
  const [showDiagTest, setShowDiagTest] = useState(() => !loadDiagnostic());
  const [showDiagResult, setShowDiagResult] = useState(false);
  const [prevDiagnostic, setPrevDiagnostic] = useState(null);
  // Replay a momentary animation on the header level icon (sparkle / wave).
  const fireFx = useCallback((type) => setHeaderFx(f => ({ type, key: f.key + 1 })), []);
  // 5-in-a-row (and every 5 thereafter) makes the level icon sparkle.
  const handleCombo = useCallback((nc, m) => {
    if (nc > 0 && nc % 5 === 0) fireFx("sparkle");
    if (m === "type" && nc >= 5) evalAchRef.current && evalAchRef.current({ typeFive:true });
  }, [fireFx]);
  const evalAchRef = useRef(null);
  const masteryRef = useRef(mastery);
  const dailyRef = useRef(daily);
  const streakRef = useRef(streak);
  const xpRef = useRef(xp);
  const calRef = useRef(calendar);

  // Theme — keep <body> background/text in sync and persist choice.
  useEffect(() => {
    applyTheme(theme);
    document.body.style.background = C.bgGrad;
    document.body.style.backgroundAttachment = "fixed";
    document.body.style.color = C.cream;
    saveTheme(theme);
  }, [theme]);
  const toggleTheme = useCallback(() => setTheme(t => (t === "dark" ? "light" : "dark")), []);

  // Evaluate achievements against current stats; unlock newly-earned badges.
  const evalAch = useCallback((extra, silent) => {
    const m = masteryRef.current;
    let masteredCount = 0, learnPlus = 0;
    for (let i=0;i<VOCAB.length;i++) {
      const lvl = m[VOCAB[i].w] || 0;
      if (lvl >= 3) masteredCount++;
      if (lvl >= 1) learnPlus++;
    }
    const c = achcRef.current;
    const s = {
      correctTotal: c.correctTotal || 0,
      consecutiveCorrect: c.consecutiveCorrect || 0,
      composeDone: c.composeDone || 0,
      streak: effectiveStreak(streakRef.current),
      masteredCount, learnPlus, total: VOCAB.length,
      typeFive: false, perfectRound: false,
      ...(extra || {}),
    };
    const cur = achRef.current;
    const newly = [];
    for (let i=0;i<ACH.length;i++) {
      const a = ACH[i];
      if (!cur[a.id] && a.test(s)) newly.push(a);
    }
    if (newly.length === 0) return;
    const updated = { ...cur };
    newly.forEach(a => { updated[a.id] = true; });
    achRef.current = updated; setAch(updated); saveAch(updated);
    if (!silent) setAchQueue(q => [...q, ...newly]);
  }, []);
  evalAchRef.current = evalAch;

  // Silent baseline evaluation on mount (unlock anything already earned).
  useEffect(() => { evalAch(null, true); }, [evalAch]);

  // Show queued achievement popups one at a time.
  useEffect(() => {
    if (achQueue.length === 0) return;
    confetti(60, true);
    const t = setTimeout(() => setAchQueue(q => q.slice(1)), 3600);
    return () => clearTimeout(t);
  }, [achQueue]);

  // auto-dismiss celebration toast
  useEffect(() => {
    if (!celebrate) return;
    const t = setTimeout(() => setCelebrate(null), 3500);
    return () => clearTimeout(t);
  }, [celebrate]);

  // auto-dismiss level-up overlay
  useEffect(() => {
    if (!levelUp) return;
    const t = setTimeout(() => setLevelUp(null), 5500);
    return () => clearTimeout(t);
  }, [levelUp]);

  // Award XP and detect level-up.
  const addXp = useCallback((amount) => {
    if (!amount) return;
    const before = xpRef.current;
    const after = before + amount;
    const lvBefore = levelInfo(before).lvNum;
    const lvAfter = levelInfo(after).lvNum;
    xpRef.current = after; setXp(after); saveXP(after);
    if (lvAfter > lvBefore) {
      const info = levelInfo(after);
      setLevelUp({ name: info.name, lvNum: info.lvNum, icon: info.icon });
      confetti(120, true);
    }
  }, []);

  // Called once per answered problem (Quiz/Type/Write). transition: {cur,next} or null.
  const recordSolved = useCallback((transition) => {
    const today = todayKey();
    // streak — count once per day
    const s = streakRef.current;
    if (s.lastDate !== today) {
      const newCount = (s.lastDate === yesterdayKey()) ? (s.count || 0) + 1 : 1;
      const ns = { count: newCount, lastDate: today };
      streakRef.current = ns; setStreak(ns); saveStreak(ns);
      if ([3,7,14,30].indexOf(newCount) >= 0) {
        const msgs = {3:"🔥 3日連続！習慣化スタート",7:"🔥 1週間連続！素晴らしい",14:"🔥 2週間連続！もう本物",30:"🔥 30日連続！圧巻です"};
        setCelebrate(msgs[newCount]);
        confetti(80, true);
      }
    }
    // daily summary + goal
    const base = dailyRef.current.date === today ? dailyRef.current : { date: today, solved:0, learned:0, mastered:0 };
    const solved = base.solved + 1;
    const nd = {
      ...base,
      solved,
      learned: base.learned + (transition && transition.cur === 0 && transition.next > 0 ? 1 : 0),
      mastered: base.mastered + (transition && transition.cur < 3 && transition.next >= 3 ? 1 : 0),
    };
    dailyRef.current = nd; setDaily(nd); saveDaily(nd);
    // calendar — per-day problem count
    const cal = { ...calRef.current };
    cal[today] = (cal[today] || 0) + 1;
    calRef.current = cal; setCalendar(cal); saveCalendar(cal);
    if (base.solved < GOAL && solved >= GOAL) {
      setCelebrate("🎯 今日の目標 達成！");
      confetti(90, true);
    }
  }, []);

  const handleAnswer = useCallback((word, correct, xpGain) => {
    const cur = masteryRef.current[word] || 0;
    const next = correct ? Math.min(cur+1, 3) : Math.max(cur-1, 0);
    const updated = { ...masteryRef.current, [word]: next };
    masteryRef.current = updated;
    setMastery(updated);
    saveMastery(updated);
    recordSolved({ cur, next });
    if (correct) addXp(xpGain || 0);
    const c = achcRef.current;
    if (correct) { c.correctTotal = (c.correctTotal||0)+1; c.consecutiveCorrect = (c.consecutiveCorrect||0)+1; }
    else { c.consecutiveCorrect = 0; }
    achcRef.current = c; saveAchc(c);
    evalAch();
  }, [recordSolved, addXp, evalAch]);

  const handleQuizAnswer = useCallback((word, correct) => handleAnswer(word, correct, 10), [handleAnswer]);
  const handleTypeAnswer = useCallback((word, correct) => handleAnswer(word, correct, 15), [handleAnswer]);

  const handleCompose = useCallback(() => {
    recordSolved(null); addXp(30);
    const c = achcRef.current; c.composeDone = (c.composeDone||0)+1; achcRef.current = c; saveAchc(c);
    evalAch();
  }, [recordSolved, addXp, evalAch]);
  const handlePerfect = useCallback(() => evalAch({ perfectRound:true }), [evalAch]);

  const handleReset = () => {
    if(confirm("進捗をすべてリセットしますか？")){
      masteryRef.current = {};
      setMastery({});
      saveMastery({});
    }
  };

  const handleDiagComplete = useCallback((result) => {
    setDiagnostic(result);
    setShowDiagTest(false);
    setShowDiagResult(true);
    confetti(80, true);
  }, []);

  const handleDiagSkip = useCallback(() => {
    setShowDiagTest(false);
  }, []);

  const handleRetakeDiag = useCallback(() => {
    setPrevDiagnostic(diagnostic);
    setShowDiagResult(false);
    setShowDiagTest(true);
  }, [diagnostic]);

  const handleCloseDiagResult = useCallback(() => {
    setShowDiagResult(false);
    setPrevDiagnostic(null);
  }, []);

  const tabs = [
    {id:"quiz",icon:"🎯",label:"Quiz"},
    {id:"type",icon:"✍️",label:"Type"},
    {id:"compose",icon:"✏️",label:"Compose"},
    {id:"stats",icon:"📊",label:"Stats"},
  ];
  const total = VOCAB.length;
  const masteredCount = VOCAB.filter(v=>(mastery[v.w]||0)>=3).length;
  const learningCount = VOCAB.filter(v=>{const m=mastery[v.w]||0;return m>0&&m<3;}).length;
  const masteredPct = masteredCount/total*100;
  const learningPct = learningCount/total*100;
  const streakDays = effectiveStreak(streak);
  const todaySolved = daily.date === todayKey() ? daily.solved : 0;
  const goalDone = todaySolved >= GOAL;
  const lv = levelInfo(xp);

  return (
    <div style={{minHeight:"100vh",background:C.bgGrad,color:C.cream,maxWidth:480,margin:"0 auto",position:"relative",zIndex:1}}>
      <Ambient />
      <div style={{position:"relative",zIndex:1}}>

      {/* Diagnostic Test (first-time or retake) */}
      {showDiagTest && (
        <div style={{position:"fixed",inset:0,zIndex:9999,background:C.bg,overflowY:"auto"}}>
          <DiagnosticTest onComplete={handleDiagComplete} onSkip={diagnostic ? null : handleDiagSkip} />
        </div>
      )}

      {/* Diagnostic Result Screen */}
      {showDiagResult && diagnostic && (
        <div style={{position:"fixed",inset:0,zIndex:9998,background:C.bg,overflowY:"auto"}}>
          <DiagnosticResult result={diagnostic} prevResult={prevDiagnostic} onClose={handleCloseDiagResult} onRetake={handleRetakeDiag} />
        </div>
      )}

      {/* Word of the day (launch modal) */}
      {!showDiagTest&&!showDiagResult&&showWotd&&wotd&&(
        <div style={{position:"fixed",inset:0,zIndex:9996,background:"rgba(17,10,20,0.92)",
          display:"flex",alignItems:"center",justifyContent:"center",padding:24}}>
          <div className="modal-pop glass" style={{maxWidth:380,width:"100%",background:C.card,borderRadius:20,
            padding:"32px 24px",textAlign:"center",border:"1px solid "+C.bdr,borderTop:"1px solid "+C.glassTop,boxShadow:"0 20px 60px rgba(0,0,0,0.5)"}}>
            <div style={{fontSize:12,letterSpacing:3,color:C.muted,marginBottom:14}}>今日の一語 · WORD OF THE DAY</div>
            <span style={{background:CAT_C[wotd.c],color:"white",padding:"3px 12px",borderRadius:20,fontSize:12}}>{CAT_L[wotd.c]}</span>
            <div style={{fontFamily:"'Noto Sans JP',sans-serif",fontSize:34,fontWeight:700,color:C.lilac,margin:"18px 0 8px",lineHeight:1.2}}>{wotd.w}</div>
            <div style={{fontSize:16,color:C.cream,marginBottom:18}}>{wotd.m}</div>
            <div style={{padding:"14px 16px",background:C.bg,borderRadius:12,borderLeft:"3px solid "+C.lav,textAlign:"left",marginBottom:24}}>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:4}}>
                <span style={{fontSize:12,color:C.muted}}>例文</span>
                <SpeakButton text={wotd.e} />
              </div>
              <div style={{fontSize:15,fontStyle:"italic",lineHeight:1.6,color:C.lilac}}>{wotd.e}</div>
            </div>
            <button onClick={()=>{setShowWotd(false);fireFx("wave");}} className="main-btn"
              style={{...baseBtn,background:C.btnGrad,color:ON_ACCENT,padding:"14px 0",fontSize:15,width:"100%"}}>学習を始める →</button>
          </div>
        </div>
      )}

      {/* Level-up overlay (2-stage, bouncing icon) */}
      {levelUp&&<LevelUpOverlay info={levelUp} onClose={()=>setLevelUp(null)} />}

      {/* Achievement unlocked popup */}
      {achQueue.length>0&&<AchievementPopup ach={achQueue[0]} />}

      {/* Celebration toast */}
      {celebrate&&(
        <div className="pulse" style={{position:"fixed",top:16,left:"50%",transform:"translateX(-50%)",zIndex:9998,
          background:C.plum,color:ON_ACCENT,padding:"12px 22px",borderRadius:999,fontSize:15,fontWeight:700,
          boxShadow:"0 8px 28px rgba(0,0,0,0.45)",border:"1px solid "+C.dusty,whiteSpace:"nowrap"}}>
          {celebrate}
        </div>
      )}

      {/* Header */}
      <div style={{padding:"20px 20px 12px",borderBottom:"1px solid "+C.bdr}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div style={{fontFamily:"'Noto Sans JP',sans-serif",fontSize:22,fontWeight:700,letterSpacing:1}}>ORINAS English Drill</div>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <button onClick={toggleTheme} title={theme==="dark"?"ライトモードに切替":"ダークモードに切替"}
              style={{...baseBtn,background:C.card,border:"1px solid "+C.bdr,color:C.lav,width:34,height:34,
                display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,borderRadius:999}}>
              {theme==="dark"?"☀️":"🌙"}
            </button>
            <div title="連続学習日数" className={streakDays>0?"txt-glow":""} style={{display:"flex",alignItems:"center",gap:4,background:C.card,padding:"4px 10px",borderRadius:999,fontSize:14,fontWeight:700,color:streakDays>0?C.gold:C.muted}}>
              <span style={{fontSize:16,filter:streakDays>0?"none":"grayscale(1) opacity(0.6)"}}>🔥</span>{streakDays}
            </div>
          </div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:12,marginTop:10}}>
          <div style={{flex:1,height:6,background:C.muted,borderRadius:3,overflow:"hidden",display:"flex"}}>
            <div style={{height:"100%",width:masteredPct+"%",background:C.ok,transition:"width 0.5s"}} />
            <div style={{height:"100%",width:learningPct+"%",background:C.gold,transition:"width 0.5s"}} />
          </div>
        </div>
        <div style={{display:"flex",gap:14,marginTop:8,fontSize:12,color:C.muted}}>
          <span><span style={{color:C.ok,fontWeight:700}}>習得済み {masteredCount}</span></span>
          <span><span style={{color:C.gold,fontWeight:700}}>学習中 {learningCount}</span></span>
          <span>全{total}語</span>
        </div>
        {/* Daily goal */}
        <div style={{display:"flex",alignItems:"center",gap:10,marginTop:12,padding:"8px 12px",background:C.card,borderRadius:10}}>
          <span style={{fontSize:13,color:goalDone?C.ok:C.lav,fontWeight:700,whiteSpace:"nowrap"}}>
            {goalDone?"🎯 今日の目標 達成済み ✓":"🎯 今日の目標 "+Math.min(todaySolved,GOAL)+" / "+GOAL+"問"}
          </span>
          <div style={{flex:1,height:6,background:C.bg,borderRadius:3,overflow:"hidden"}}>
            <div style={{height:"100%",width:Math.min(100,todaySolved/GOAL*100)+"%",background:goalDone?C.ok:C.dusty,transition:"width 0.4s"}} />
          </div>
        </div>
        {/* Level & XP */}
        <div style={{marginTop:12}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:4}}>
            <span style={{fontSize:13,fontWeight:700,color:C.lav,display:"flex",alignItems:"center",gap:5}}>
              <span key={headerFx.key} className={headerFx.type} style={{fontSize:17,display:"inline-block"}}>{lv.icon}</span>
              <span className="txt-glow"><span style={{color:C.gold}}>Lv{lv.lvNum}</span> {lv.name}</span>
            </span>
            <span style={{fontSize:11,color:C.muted}}>
              {lv.next ? (lv.into+" / "+lv.span+" XP → "+lv.next.icon+" "+lv.next.n) : (lv.xp+" XP · MAX")}
            </span>
          </div>
          <div style={{height:6,background:C.card,borderRadius:3,overflow:"hidden"}}>
            <div className="shimmer" style={{height:"100%",width:lv.pct+"%",background:"linear-gradient(90deg,"+C.dusty+","+C.gold+")",transition:"width 0.5s"}} />
          </div>
        </div>
      </div>

      {/* Personalized recommendation banner */}
      {diagnostic && !showDiagTest && !showDiagResult && (mode==="quiz"||mode==="type") && diagnostic.writeNum < diagnostic.vocabNum - 1 && (
        <div style={{padding:"10px 20px",background:"rgba(142,86,135,0.15)",borderBottom:"1px solid "+C.dusty}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <span style={{fontSize:18}}>✏️</span>
            <div style={{flex:1}}>
              <div style={{fontSize:12,color:C.lav,fontWeight:600}}>おすすめ: Composeモード</div>
              <div style={{fontSize:11,color:C.muted}}>語彙力を実践力に変えましょう</div>
            </div>
            <button onClick={()=>setMode("compose")}
              style={{...baseBtn,background:C.btnGrad,color:ON_ACCENT,padding:"6px 14px",fontSize:12}}>
              試す →
            </button>
          </div>
        </div>
      )}

      {/* Category Filter */}
      {(mode==="quiz"||mode==="type")&&(
        <div style={{padding:"10px 20px",display:"flex",gap:6,overflowX:"auto"}}>
          {[{id:"all",l:"All"},{id:"c",l:"Core"},{id:"a",l:"Advanced"},{id:"t",l:"Tough"},
            {id:"cr",l:"Career"},{id:"pr",l:"Praise"},{id:"wb",l:"Wellbeing"},{id:"ng",l:"Negotiation"},
            {id:"fn",l:"Finance"},{id:"lg",l:"Legal"},{id:"em",l:"Email"},{id:"bg",l:"Basics"}].map(f=>{
            const accent = f.id==="all" ? C.plum : (CAT_C[f.id] || C.plum);
            const active = catFilter===f.id;
            return (
            <button key={f.id} onClick={()=>setCatFilter(f.id)}
              style={{...baseBtn,background:active?accent:C.card,color:active?"#fff":C.muted,
                padding:"6px 14px",fontSize:12,whiteSpace:"nowrap",border:"1px solid "+(active?accent:C.bdr)}}>
              {f.l}
            </button>
          );})}
        </div>
      )}

      {/* Content */}
      <div key={mode} className="tab-anim" style={{paddingBottom:80}}>
        {mode==="quiz"&&<QuizMode vocab={VOCAB} mastery={mastery} onAnswer={handleQuizAnswer} onCombo={handleCombo} onPerfect={handlePerfect} catFilter={catFilter} diagnostic={diagnostic} />}
        {mode==="type"&&<TypeMode vocab={VOCAB} mastery={mastery} onAnswer={handleTypeAnswer} onCombo={handleCombo} onPerfect={handlePerfect} catFilter={catFilter} diagnostic={diagnostic} />}
        {mode==="compose"&&<ComposeMode onSolved={handleCompose} />}
        {mode==="stats"&&<StatsView vocab={VOCAB} mastery={mastery} daily={daily} calendar={calendar} xp={xp} ach={ach} diagnostic={diagnostic} onReset={handleReset} onRetakeDiag={handleRetakeDiag} />}
      </div>

      {/* Bottom Nav */}
      <div style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:480,
        background:C.bg,borderTop:"1px solid "+C.bdr,display:"flex",padding:"8px 0 12px",zIndex:100}}>
        {tabs.map(t=>(
          <button key={t.id} onClick={()=>setMode(t.id)}
            style={{...baseBtn,flex:1,background:"transparent",color:mode===t.id?C.lav:C.muted,
              display:"flex",flexDirection:"column",alignItems:"center",gap:2,padding:"6px 0"}}>
            <span style={{fontSize:20}}>{t.icon}</span>
            <span style={{fontSize:10,fontWeight:mode===t.id?600:400}}>{t.label}</span>
          </button>
        ))}
      </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
