const shuffle = a => { const b=[...a]; for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];} return b; };
const norm = s => s.toLowerCase().replace(/[^a-z0-9 ]/g,"").replace(/\s+/g," ").trim();

function pickWrong(correct, pool, n) {
  n = n || 3;
  return shuffle(pool.filter(v => v.w !== correct.w)).slice(0, n);
}

function checkTyped(input, word) {
  const i = norm(input);
  const core = norm(word.replace(/\(.*?\)/g,"").trim());
  if (!i) return false;
  if (i === core) return true;
  const words = core.split(" ");
  if (words.length > 1 && words.every(w => i.includes(w))) return true;
  if (core.length > 3 && (i.includes(core) || core.includes(i))) return true;
  const a=i, b=core;
  const m = [];
  for (let x=0;x<=a.length;x++) { m[x]=[]; for(let y=0;y<=b.length;y++) m[x][y]=x||y; }
  for(let x=1;x<=a.length;x++) for(let y=1;y<=b.length;y++)
    m[x][y]=Math.min(m[x-1][y]+1,m[x][y-1]+1,m[x-1][y-1]+(a[x-1]!==b[y-1]?1:0));
  return m[a.length][b.length] <= Math.max(1, Math.floor(core.length * 0.25));
}

function selectWords(vocab, mastery, count, catFilter) {
  count = count || 10;
  catFilter = catFilter || "all";
  let pool = catFilter === "all" ? vocab.slice() : vocab.filter(v => v.c === catFilter);
  if (pool.length === 0) pool = vocab.slice();
  const scored = pool.map(v => ({ ...v, score: mastery[v.w] || 0 }));
  scored.sort((a,b) => a.score - b.score || Math.random() - 0.5);
  return scored.slice(0, Math.min(count, scored.length));
}

// ── Today's summary (date-stamped, resets on new day) ──
const todayKey = () => {
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
};
function loadDaily() {
  const fresh = { date: todayKey(), solved: 0, learned: 0, mastered: 0 };
  try {
    const r = localStorage.getItem('orinas-daily-v1');
    if (!r) return fresh;
    const d = JSON.parse(r);
    return d.date === todayKey() ? d : fresh;
  } catch(e) { return fresh; }
}
function saveDaily(d) {
  try { localStorage.setItem('orinas-daily-v1', JSON.stringify(d)); } catch(e) {}
}

// ── In-progress session (resume support) ──
function loadSession(mode) {
  try {
    const r = localStorage.getItem('orinas-session-'+mode+'-v1');
    if (!r) return null;
    const s = JSON.parse(r);
    if (!s || !Array.isArray(s.questions) || !Array.isArray(s.results)) return null;
    if (s.questions.length === 0 || s.results.length >= s.questions.length) return null;
    return s;
  } catch(e) { return null; }
}
function saveSession(mode, s) {
  try { localStorage.setItem('orinas-session-'+mode+'-v1', JSON.stringify(s)); } catch(e) {}
}
function clearSession(mode) {
  try { localStorage.removeItem('orinas-session-'+mode+'-v1'); } catch(e) {}
}

// ═══════════════════ QUIZ MODE ═══════════════════
function QuizMode({ vocab, mastery, onAnswer, catFilter }) {
  const [questions, setQuestions] = useState([]);
  const [idx, setIdx] = useState(0);
  const [selected, setSelected] = useState(null);
  const [results, setResults] = useState([]);
  const [done, setDone] = useState(false);
  const [resume, setResume] = useState(null);
  const firstRef = useRef(true);

  const initNew = () => {
    const sel = selectWords(vocab, mastery, 10, catFilter);
    const qs = sel.map(v => {
      const d = Math.random() > 0.5 ? "jp" : "en";
      const wrong = pickWrong(v, vocab);
      return { word:v, dir:d, choices:shuffle([v,...wrong]) };
    });
    clearSession('quiz'); setResume(null);
    setQuestions(qs); setIdx(0); setSelected(null); setResults([]); setDone(false);
  };
  useEffect(() => {
    if (firstRef.current) {
      firstRef.current = false;
      const saved = loadSession('quiz');
      if (saved) { setResume(saved); return; }
    }
    initNew();
  }, [catFilter]);

  const doResume = () => {
    const s = resume;
    setQuestions(s.questions); setResults(s.results); setIdx(s.results.length);
    setSelected(null); setDone(false); setResume(null);
  };

  if (resume) return <ResumeDialog answered={resume.results.length} total={resume.questions.length} onResume={doResume} onNew={initNew} />;
  if (questions.length === 0) return null;
  if (done) {
    const correct = results.filter(r=>r).length;
    return (
      <div className="fade-in" style={{padding:24,textAlign:"center"}}>
        <div style={{fontSize:64,marginBottom:16}}>{correct>=8?"🎉":correct>=5?"👍":"💪"}</div>
        <div style={{fontFamily:"'Noto Sans JP',sans-serif",fontSize:32,fontWeight:700,marginBottom:8}}>{correct} / {results.length}</div>
        <div style={{color:C.muted,marginBottom:32}}>{correct>=8?"Excellent!":correct>=5?"Good progress!":"Keep practicing!"}</div>
        <button onClick={initNew} style={{...baseBtn,background:C.plum,color:C.cream,padding:"14px 32px",fontSize:16}}>Next Round →</button>
      </div>
    );
  }

  const q = questions[idx];
  const isCorrect = selected !== null ? selected === q.word.w : null;

  return (
    <div className="fade-in" style={{padding:"16px 20px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
        <span style={{color:C.muted,fontSize:14}}>{idx+1} / {questions.length}</span>
        <span style={{background:CAT_C[q.word.c],color:"white",padding:"3px 10px",borderRadius:20,fontSize:12}}>{CAT_L[q.word.c]}</span>
      </div>
      <div style={{textAlign:"center",marginBottom:28}}>
        <div style={{color:C.muted,fontSize:13,marginBottom:6}}>{q.dir==="jp"?"この意味の英語は？":"この英語の意味は？"}</div>
        <div style={{fontFamily:"'Noto Sans JP',sans-serif",fontSize:26,fontWeight:700,lineHeight:1.3}}>
          {q.dir==="jp"?q.word.m:q.word.w}
        </div>
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        {q.choices.map(ch => {
          const isThis = selected===ch.w;
          const isRight = ch.w===q.word.w;
          let bg=C.card, bdr=C.bdr;
          if(selected!==null){
            if(isRight){bg="rgba(110,203,115,0.15)";bdr=C.ok;}
            else if(isThis){bg="rgba(232,112,112,0.15)";bdr=C.ng;}
          }
          return (
            <button key={ch.w} disabled={selected!==null}
              className={selected!==null&&isThis?(isCorrect?"pulse":"shake"):""}
              onClick={()=>{
                setSelected(ch.w);
                const ok=ch.w===q.word.w;
                onAnswer(q.word.w,ok);
                const nr=[...results,ok];
                setResults(nr);
                saveSession('quiz',{questions,results:nr});
              }}
              style={{...baseBtn,background:bg,border:"1.5px solid "+bdr,padding:"14px 16px",fontSize:15,color:C.cream,textAlign:"left",width:"100%"}}>
              {q.dir==="jp"?ch.w:ch.m}
            </button>
          );
        })}
      </div>
      {selected!==null&&(
        <div className="fade-in" style={{marginTop:20,padding:16,background:C.card,borderRadius:12,borderLeft:"3px solid "+(isCorrect?C.ok:C.ng)}}>
          <div style={{fontSize:13,color:C.muted,marginBottom:4}}>例文</div>
          <div style={{fontSize:14,fontStyle:"italic",lineHeight:1.5}}>{q.word.e}</div>
        </div>
      )}
      {selected!==null&&(
        <div style={{textAlign:"center",marginTop:20}}>
          <button onClick={()=>{if(idx<questions.length-1){setIdx(idx+1);setSelected(null);}else{clearSession('quiz');setDone(true);}}}
            style={{...baseBtn,background:C.plum,color:C.cream,padding:"12px 28px",fontSize:15}}>
            {idx<questions.length-1?"Next →":"Results →"}
          </button>
        </div>
      )}
    </div>
  );
}

// ═══════════════════ TYPE MODE ═══════════════════
function TypeMode({ vocab, mastery, onAnswer, catFilter }) {
  const [questions, setQuestions] = useState([]);
  const [idx, setIdx] = useState(0);
  const [input, setInput] = useState("");
  const [checked, setChecked] = useState(null);
  const [hintLv, setHintLv] = useState(0);
  const [results, setResults] = useState([]);
  const [done, setDone] = useState(false);
  const [resume, setResume] = useState(null);
  const inputRef = useRef(null);
  const firstRef = useRef(true);

  const initNew = () => {
    const sel = selectWords(vocab, mastery, 10, catFilter);
    clearSession('type'); setResume(null);
    setQuestions(sel); setIdx(0); setInput(""); setChecked(null); setHintLv(0); setResults([]); setDone(false);
  };
  useEffect(() => {
    if (firstRef.current) {
      firstRef.current = false;
      const saved = loadSession('type');
      if (saved) { setResume(saved); return; }
    }
    initNew();
  }, [catFilter]);
  useEffect(() => { if(inputRef.current&&checked===null&&!resume) inputRef.current.focus(); }, [idx,checked,resume]);

  const doResume = () => {
    const s = resume;
    setQuestions(s.questions); setResults(s.results); setIdx(s.results.length);
    setInput(""); setChecked(null); setHintLv(0); setDone(false); setResume(null);
  };

  if (resume) return <ResumeDialog answered={resume.results.length} total={resume.questions.length} onResume={doResume} onNew={initNew} />;
  if(questions.length===0) return null;
  if(done){
    const correct=results.filter(r=>r).length;
    const missed=questions.filter((_,i)=>!results[i]);
    return (
      <div className="fade-in" style={{padding:24,textAlign:"center"}}>
        <div style={{fontSize:64,marginBottom:16}}>{correct>=8?"🎉":correct>=5?"👍":"💪"}</div>
        <div style={{fontFamily:"'Noto Sans JP',sans-serif",fontSize:32,fontWeight:700,marginBottom:8}}>{correct}/{results.length}</div>
        {missed.length>0&&(
          <div style={{marginTop:20,textAlign:"left"}}>
            <div style={{color:C.muted,fontSize:13,marginBottom:10}}>復習が必要な単語：</div>
            {missed.map(v=>(
              <div key={v.w} style={{padding:"8px 12px",background:C.card,borderRadius:8,marginBottom:6,fontSize:14}}>
                <span style={{color:C.lav,fontWeight:600}}>{v.w}</span>
                <span style={{color:C.muted}}> — {v.m}</span>
              </div>
            ))}
          </div>
        )}
        <button onClick={initNew} style={{...baseBtn,background:C.plum,color:C.cream,padding:"14px 32px",fontSize:16,marginTop:24}}>Next Round →</button>
      </div>
    );
  }

  const q = questions[idx];
  const hint = q.w.slice(0, Math.min(hintLv+1, q.w.length));

  const doCheck = () => {
    const ok = checkTyped(input, q.w);
    setChecked(ok);
    onAnswer(q.w, ok);
    const nr=[...results, ok];
    setResults(nr);
    saveSession('type',{questions,results:nr});
  };

  return (
    <div className="fade-in" style={{padding:"16px 20px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
        <span style={{color:C.muted,fontSize:14}}>{idx+1}/{questions.length}</span>
        <span style={{background:CAT_C[q.c],color:"white",padding:"3px 10px",borderRadius:20,fontSize:12}}>{CAT_L[q.c]}</span>
      </div>
      <div style={{textAlign:"center",marginBottom:24}}>
        <div style={{color:C.muted,fontSize:13,marginBottom:6}}>この意味の英語をタイプしてください</div>
        <div style={{fontFamily:"'Noto Sans JP',sans-serif",fontSize:26,fontWeight:700,lineHeight:1.3}}>{q.m}</div>
      </div>
      {hintLv>0&&checked===null&&(
        <div className="fade-in" style={{textAlign:"center",marginBottom:12,color:C.gold,fontSize:14}}>
          ヒント: {hint}{"_".repeat(Math.max(0,q.w.length-hint.length))}
        </div>
      )}
      <div style={{display:"flex",gap:8,marginBottom:12}}>
        <input ref={inputRef} value={input} onChange={e=>setInput(e.target.value)} disabled={checked!==null}
          onKeyDown={e=>{if(e.key==="Enter"&&input.trim())doCheck();}}
          placeholder="Type the English word..."
          style={{flex:1,padding:"14px 16px",borderRadius:12,border:"1.5px solid "+(checked===null?C.bdr:checked?C.ok:C.ng),
            background:C.card,color:C.cream,fontSize:16,outline:"none"}} />
        {checked===null&&(
          <button onClick={doCheck} disabled={!input.trim()}
            style={{...baseBtn,background:input.trim()?C.plum:C.card,color:C.cream,padding:"14px 18px",fontSize:15,opacity:input.trim()?1:0.5}}>✓</button>
        )}
      </div>
      {checked===null&&(
        <button onClick={()=>setHintLv(h=>h+1)}
          style={{...baseBtn,background:"transparent",color:C.muted,padding:"8px 0",fontSize:13,width:"100%"}}>
          💡 ヒントを見る
        </button>
      )}
      {checked!==null&&(
        <div className="fade-in" style={{padding:16,background:C.card,borderRadius:12,borderLeft:"3px solid "+(checked?C.ok:C.ng),marginBottom:16}}>
          <div style={{fontSize:14,marginBottom:4}}>
            {checked
              ? <span style={{color:C.ok}}>✓ Correct!</span>
              : <span style={{color:C.ng}}>✗ 正解: <strong style={{color:C.lav}}>{q.w}</strong></span>}
          </div>
          <div style={{fontSize:13,color:C.muted,marginTop:8}}>例文</div>
          <div style={{fontSize:14,fontStyle:"italic",lineHeight:1.5}}>{q.e}</div>
        </div>
      )}
      {checked!==null&&(
        <div style={{textAlign:"center"}}>
          <button onClick={()=>{if(idx<questions.length-1){setIdx(idx+1);setInput("");setChecked(null);setHintLv(0);}else{clearSession('type');setDone(true);}}}
            style={{...baseBtn,background:C.plum,color:C.cream,padding:"12px 28px",fontSize:15}}>
            {idx<questions.length-1?"Next →":"Results →"}
          </button>
        </div>
      )}
    </div>
  );
}

// ═══════════════════ STATS VIEW ═══════════════════
function StatsView({ vocab, mastery, daily, onReset }) {
  const total=vocab.length;
  const mastered=vocab.filter(v=>(mastery[v.w]||0)>=3).length;
  const learning=vocab.filter(v=>{const m=mastery[v.w]||0;return m>0&&m<3;}).length;
  const newW=total-mastered-learning;
  const pct=Math.round((mastered/total)*100);
  const cats=["c","a","t"];
  const d = daily || { solved:0, learned:0, mastered:0 };

  const weak=vocab.filter(v=>{const m=mastery[v.w]||0;return m>0&&m<3;}).sort((a,b)=>(mastery[a.w]||0)-(mastery[b.w]||0)).slice(0,10);

  return (
    <div className="fade-in" style={{padding:"16px 20px"}}>
      <div style={{fontFamily:"'Noto Sans JP',sans-serif",fontSize:22,fontWeight:700,marginBottom:20}}>Progress</div>

      {/* Today's summary */}
      <div style={{marginBottom:24}}>
        <div style={{fontSize:13,color:C.muted,marginBottom:10}}>今日の学習サマリー</div>
        <div style={{display:"flex",gap:8}}>
          {[
            {l:"解いた問題",v:d.solved,c:C.lav},
            {l:"新しく学習",v:d.learned,c:C.gold},
            {l:"習得した",v:d.mastered,c:C.ok},
          ].map(s=>(
            <div key={s.l} style={{flex:1,padding:"14px 8px",background:C.card,borderRadius:10,textAlign:"center"}}>
              <div style={{fontSize:26,fontWeight:700,color:s.c}}>{s.v}</div>
              <div style={{fontSize:11,color:C.muted,marginTop:2}}>{s.l}</div>
            </div>
          ))}
        </div>
      </div>

      <div style={{textAlign:"center",marginBottom:24}}>
        <div style={{fontFamily:"'Noto Sans JP',sans-serif",fontSize:56,fontWeight:700,color:C.lav}}>{pct}%</div>
        <div style={{color:C.muted,fontSize:14}}>習得率 ({mastered} / {total} words)</div>
      </div>
      <div style={{display:"flex",gap:8,marginBottom:24}}>
        {[{l:"習得済",v:mastered,c:C.ok},{l:"学習中",v:learning,c:C.gold},{l:"未学習",v:newW,c:C.muted}].map(s=>(
          <div key={s.l} style={{flex:1,padding:12,background:C.card,borderRadius:10,textAlign:"center"}}>
            <div style={{fontSize:24,fontWeight:700,color:s.c}}>{s.v}</div>
            <div style={{fontSize:11,color:C.muted}}>{s.l}</div>
          </div>
        ))}
      </div>
      <div style={{marginBottom:24}}>
        <div style={{fontSize:13,color:C.muted,marginBottom:10}}>カテゴリ別:</div>
        {cats.map(c=>{
          const cw=vocab.filter(v=>v.c===c);
          const cm=cw.filter(v=>(mastery[v.w]||0)>=3).length;
          const cp=cw.length?Math.round((cm/cw.length)*100):0;
          return (
            <div key={c} style={{marginBottom:10}}>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:13,marginBottom:4}}>
                <span style={{color:CAT_C[c]}}>{CAT_L[c]}</span>
                <span style={{color:C.muted}}>{cm}/{cw.length}</span>
              </div>
              <div style={{height:6,background:C.card,borderRadius:3,overflow:"hidden"}}>
                <div style={{height:"100%",width:cp+"%",background:CAT_C[c],borderRadius:3,transition:"width 0.5s"}} />
              </div>
            </div>
          );
        })}
      </div>
      {weak.length>0&&(
        <div style={{marginBottom:24}}>
          <div style={{fontSize:13,color:C.muted,marginBottom:10}}>苦手な単語 (復習優先):</div>
          {weak.map(v=>(
            <div key={v.w} style={{display:"flex",justifyContent:"space-between",padding:"8px 12px",background:C.card,borderRadius:8,marginBottom:4,fontSize:13}}>
              <span><span style={{color:C.lav,fontWeight:600}}>{v.w}</span> <span style={{color:C.muted}}>— {v.m}</span></span>
              <span style={{color:C.gold}}>Lv{mastery[v.w]||0}</span>
            </div>
          ))}
        </div>
      )}
      <button onClick={onReset}
        style={{...baseBtn,background:"transparent",border:"1px solid "+C.bdr,color:C.muted,padding:"10px 0",fontSize:13,width:"100%"}}>
        進捗をリセット
      </button>
    </div>
  );
}

function ComposeMode() {
  const [sc, setSc] = useState(null);
  const [text, setText] = useState("");
  const [loading, setLoading] = useState(false);
  const [result, setResult] = useState(null);
  const [error, setError] = useState(null);

  const wordInfo = w => VOCAB.find(v=>v.w===w) || { w, m:"" };
  const reset = () => { setText(""); setResult(null); setError(null); };

  const submit = async () => {
    if(!text.trim()||loading) return;
    setLoading(true); setError(null); setResult(null);
    try {
      const res = await fetch("/api/evaluate", {
        method:"POST",
        headers:{"content-type":"application/json"},
        body: JSON.stringify({ scenario: sc.t+" — "+sc.s, words: sc.words, text }),
      });
      const data = await res.json().catch(()=>({}));
      if(!res.ok) throw new Error(data.error || ("サーバーエラー ("+res.status+")"));
      setResult(data);
    } catch(e) {
      setError(e.message || "通信に失敗しました。");
    } finally {
      setLoading(false);
    }
  };

  // ── Scenario list ──
  if(!sc) {
    return (
      <div className="fade-in" style={{padding:"16px 20px"}}>
        <div style={{fontFamily:"'Noto Sans JP',sans-serif",fontSize:22,fontWeight:700,marginBottom:6}}>Compose</div>
        <div style={{color:C.muted,fontSize:13,marginBottom:18,lineHeight:1.6}}>シナリオを1つ選び、指定の単語をすべて使って英作文しましょう。AIが添削します。</div>
        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          {SCENARIOS.map(s=>(
            <button key={s.id} onClick={()=>{setSc(s);reset();}}
              style={{...baseBtn,background:C.card,border:"1px solid "+C.bdr,padding:"14px 16px",textAlign:"left",width:"100%"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                <span style={{color:C.cream,fontWeight:600,fontSize:15}}>{s.t}</span>
                <span style={{background:CAT_C[s.cat],color:"white",padding:"2px 8px",borderRadius:20,fontSize:11}}>{CAT_L[s.cat]}</span>
              </div>
              <div style={{color:C.muted,fontSize:12,lineHeight:1.5,marginBottom:8}}>{s.s}</div>
              <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                {s.words.map(w=>(
                  <span key={w} style={{background:C.cardH,color:C.lav,padding:"2px 8px",borderRadius:6,fontSize:12}}>{w}</span>
                ))}
              </div>
            </button>
          ))}
        </div>
      </div>
    );
  }

  // ── Compose / result ──
  const canSend = text.trim() && !loading;
  return (
    <div className="fade-in" style={{padding:"16px 20px"}}>
      <button onClick={()=>{setSc(null);reset();}}
        style={{...baseBtn,background:"transparent",color:C.muted,padding:"4px 0",fontSize:13,marginBottom:12}}>← シナリオ一覧</button>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
        <span style={{color:C.cream,fontWeight:600,fontSize:16}}>{sc.t}</span>
        <span style={{background:CAT_C[sc.cat],color:"white",padding:"2px 8px",borderRadius:20,fontSize:11}}>{CAT_L[sc.cat]}</span>
      </div>
      <div style={{color:C.lilac,fontSize:13,lineHeight:1.6,marginBottom:14,padding:"12px 14px",background:C.card,borderRadius:10}}>{sc.s}</div>
      <div style={{fontSize:12,color:C.muted,marginBottom:8}}>次の単語・表現をすべて使ってください:</div>
      <div style={{display:"flex",flexDirection:"column",gap:6,marginBottom:16}}>
        {sc.words.map(w=>{const info=wordInfo(w);return(
          <div key={w} style={{display:"flex",gap:8,alignItems:"baseline",padding:"6px 10px",background:C.card,borderRadius:8}}>
            <span style={{color:C.lav,fontWeight:600,fontSize:14}}>{info.w}</span>
            <span style={{color:C.muted,fontSize:12}}>{info.m}</span>
          </div>
        );})}
      </div>
      <textarea value={text} onChange={e=>setText(e.target.value)} disabled={loading}
        placeholder="ここに英文を書いてください..." rows={5}
        style={{width:"100%",padding:"14px 16px",borderRadius:12,border:"1.5px solid "+C.bdr,
          background:C.card,color:C.cream,fontSize:15,outline:"none",resize:"vertical",lineHeight:1.6}} />
      <button onClick={submit} disabled={!canSend}
        style={{...baseBtn,background:canSend?C.plum:C.card,color:C.cream,padding:"14px 0",fontSize:15,width:"100%",marginTop:12,opacity:canSend?1:0.5}}>
        {loading?"添削中…":"添削してもらう"}
      </button>
      {error&&(
        <div className="fade-in" style={{marginTop:16,padding:14,background:"rgba(232,112,112,0.12)",border:"1px solid "+C.ng,borderRadius:10,fontSize:13,color:C.ng,lineHeight:1.6}}>
          {error}
        </div>
      )}
      {result&&(
        <div className="fade-in" style={{marginTop:20,display:"flex",flexDirection:"column",gap:14}}>
          <div style={{textAlign:"center",padding:16,background:C.card,borderRadius:12}}>
            <Stars n={result.rating||0} />
            <div style={{color:C.muted,fontSize:13,marginTop:6}}>{(result.rating||0)} / 5</div>
            {result.comment&&<div style={{fontSize:14,lineHeight:1.6,marginTop:10}}>{result.comment}</div>}
          </div>
          {Array.isArray(result.vocabCheck)&&result.vocabCheck.length>0&&(
            <div style={{padding:16,background:C.card,borderRadius:12}}>
              <div style={{fontSize:13,color:C.muted,marginBottom:10}}>語彙チェック</div>
              {result.vocabCheck.map((vc,i)=>{const ok=vc.used&&vc.correct;return(
                <div key={i} style={{marginBottom:8,fontSize:14,lineHeight:1.5}}>
                  <span style={{color:ok?C.ok:C.ng,marginRight:6}}>{ok?"✓":"✗"}</span>
                  <span style={{color:C.lav,fontWeight:600}}>{vc.word}</span>
                  {vc.note&&<span style={{color:C.muted}}> — {vc.note}</span>}
                </div>
              );})}
            </div>
          )}
          {[{label:"文法",val:result.grammar},{label:"自然さ",val:result.naturalness}].map(sec=>sec.val&&(
            <div key={sec.label} style={{padding:16,background:C.card,borderRadius:12}}>
              <div style={{fontSize:13,color:C.muted,marginBottom:6}}>{sec.label}</div>
              <div style={{fontSize:14,lineHeight:1.6}}>{sec.val}</div>
            </div>
          ))}
          {result.improved&&(
            <div style={{padding:16,background:C.card,borderRadius:12,borderLeft:"3px solid "+C.lav}}>
              <div style={{fontSize:13,color:C.muted,marginBottom:6}}>改善例</div>
              <div style={{fontSize:15,fontStyle:"italic",lineHeight:1.6,color:C.lilac}}>{result.improved}</div>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ═══════════════════ MAIN APP ═══════════════════
function App() {
  const [mode, setMode] = useState("quiz");
  const [mastery, setMastery] = useState(loadMastery);
  const [daily, setDaily] = useState(loadDaily);
  const [catFilter, setCatFilter] = useState("all");
  const masteryRef = useRef(mastery);

  const handleAnswer = useCallback((word, correct) => {
    const cur = masteryRef.current[word] || 0;
    const next = correct ? Math.min(cur+1, 3) : Math.max(cur-1, 0);
    const updated = { ...masteryRef.current, [word]: next };
    masteryRef.current = updated;
    setMastery(updated);
    saveMastery(updated);
    setDaily(prev => {
      const base = prev.date === todayKey() ? prev : { date: todayKey(), solved:0, learned:0, mastered:0 };
      const nd = {
        ...base,
        solved: base.solved + 1,
        learned: base.learned + (cur === 0 && next > 0 ? 1 : 0),
        mastered: base.mastered + (cur < 3 && next >= 3 ? 1 : 0),
      };
      saveDaily(nd);
      return nd;
    });
  }, []);

  const handleReset = () => {
    if(confirm("進捗をすべてリセットしますか？")){
      masteryRef.current = {};
      setMastery({});
      saveMastery({});
    }
  };

  const tabs = [
    {id:"quiz",icon:"🎯",label:"Quiz"},
    {id:"type",icon:"✍️",label:"Type"},
    {id:"compose",icon:"✏️",label:"Compose"},
    {id:"stats",icon:"📊",label:"Stats"},
  ];
  const total = VOCAB.length;
  const masteredCount = VOCAB.filter(v=>(mastery[v.w]||0)>=3).length;
  const learningCount = VOCAB.filter(v=>{const m=mastery[v.w]||0;return m>0&&m<3;}).length;
  const masteredPct = masteredCount/total*100;
  const learningPct = learningCount/total*100;

  return (
    <div style={{minHeight:"100vh",background:C.bg,color:C.cream,maxWidth:480,margin:"0 auto"}}>
      {/* Header */}
      <div style={{padding:"20px 20px 12px",borderBottom:"1px solid "+C.bdr}}>
        <div style={{fontFamily:"'Noto Sans JP',sans-serif",fontSize:22,fontWeight:700,letterSpacing:1}}>ORINAS English Drill</div>
        <div style={{display:"flex",alignItems:"center",gap:12,marginTop:8}}>
          <div style={{flex:1,height:6,background:C.muted,borderRadius:3,overflow:"hidden",display:"flex"}}>
            <div style={{height:"100%",width:masteredPct+"%",background:C.ok,transition:"width 0.5s"}} />
            <div style={{height:"100%",width:learningPct+"%",background:C.gold,transition:"width 0.5s"}} />
          </div>
        </div>
        <div style={{display:"flex",gap:14,marginTop:8,fontSize:12,color:C.muted}}>
          <span><span style={{color:C.ok,fontWeight:700}}>習得済み {masteredCount}</span></span>
          <span><span style={{color:C.gold,fontWeight:700}}>学習中 {learningCount}</span></span>
          <span>全{total}語</span>
        </div>
      </div>

      {/* Category Filter */}
      {(mode==="quiz"||mode==="type")&&(
        <div style={{padding:"10px 20px",display:"flex",gap:6,overflowX:"auto"}}>
          {[{id:"all",l:"All"},{id:"c",l:"Core"},{id:"a",l:"Advanced"},{id:"t",l:"Tough"}].map(f=>(
            <button key={f.id} onClick={()=>setCatFilter(f.id)}
              style={{...baseBtn,background:catFilter===f.id?C.plum:C.card,color:catFilter===f.id?C.cream:C.muted,
                padding:"6px 14px",fontSize:12,whiteSpace:"nowrap",border:"1px solid "+(catFilter===f.id?C.plum:C.bdr)}}>
              {f.l}
            </button>
          ))}
        </div>
      )}

      {/* Content */}
      <div style={{paddingBottom:80}}>
        {mode==="quiz"&&<QuizMode vocab={VOCAB} mastery={mastery} onAnswer={handleAnswer} catFilter={catFilter} />}
        {mode==="type"&&<TypeMode vocab={VOCAB} mastery={mastery} onAnswer={handleAnswer} catFilter={catFilter} />}
        {mode==="compose"&&<ComposeMode />}
        {mode==="stats"&&<StatsView vocab={VOCAB} mastery={mastery} daily={daily} onReset={handleReset} />}
      </div>

      {/* Bottom Nav */}
      <div style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:480,
        background:C.bg,borderTop:"1px solid "+C.bdr,display:"flex",padding:"8px 0 12px",zIndex:100}}>
        {tabs.map(t=>(
          <button key={t.id} onClick={()=>setMode(t.id)}
            style={{...baseBtn,flex:1,background:"transparent",color:mode===t.id?C.lav:C.muted,
              display:"flex",flexDirection:"column",alignItems:"center",gap:2,padding:"6px 0"}}>
            <span style={{fontSize:20}}>{t.icon}</span>
            <span style={{fontSize:10,fontWeight:mode===t.id?600:400}}>{t.label}</span>
          </button>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
